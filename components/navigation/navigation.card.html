<!-- @dsCard group="Components" viewport="700x260" name="Tabs · Pagination" subtitle="Přepínání obsahu a stránkování výpisu." -->
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--bg-color); }
  
</style>
</head>
<body>
<div class="TabsProductDetailMasterView v1a v1 bs-view">
    <div class="tabpages">
      <div class="tabs">
        <button type="button" class="page selected">Popis</button>
        <button type="button" class="page">Parametry</button>
        <button type="button" class="page">Hodnocení<span class="value">38</span></button>
        <button type="button" class="page">Doprava a platba</button>
      </div>
      <div class="pages">
        <div class="page selected">
          <p style="margin:0;color:var(--text-color-muted)">Křížový řez 4 × 35 mm odpovídá bezpečnostnímu stupni P-4 podle DIN 66399.</p>
        </div>
      </div>
    </div>
  </div>
  <div style="margin-top:16px" class="CompoundPagingView v1a v1 bs-view bottom">
    <div class="pages">
      <button type="button" class="button page previous" aria-label="Předchozí"><svg class="icon ico2"><use href="#tp-chevron-left"></use></svg></button>
      <button type="button" class="button page">1</button>
      <button type="button" class="button page">2</button>
      <button type="button" class="button page selected">3</button>
      <button type="button" class="button page">4</button>
      <span class="separator">…</span>
      <button type="button" class="button page">42</button>
      <button type="button" class="button page next" aria-label="Další"><svg class="icon ico2"><use href="#tp-chevron-right"></use></svg></button>
    </div>
  </div>
<script src="../../assets/icons/sprite.js"></script>
</body>
</html>
