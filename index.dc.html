<!DOCTYPE html>

<head>
<meta charset="utf-8">

<x-dc>
<helmet>
  <link rel="stylesheet" href="ds/styles.css">
  <script src="ds/assets/icons/sprite.js"></script>
  <style>
    body { background: var(--bg-color); color: var(--text-color); font: var(--font-weight-regular) var(--font-size-14) / var(--line-height-base) var(--font-family); margin: 0; }
    a { color: var(--link-color); text-decoration: none; }
    a:hover { color: var(--link-color-hover); text-decoration: underline; }
    /* Obchází runtime, ne DS: host má height: 100 %, takže obsah přetéká mimo svůj
       containing block a sticky hlavička by se po výšce okna odlepila. */
    html, body { height: auto; min-height: 100%; }
    #dc-root, #dc-root > .sc-host { height: auto; min-height: 100%; }
    /* CHYBÍ V DS: přilepená má zůstat hlavička i lišta kategorií — zákazník musí mít
       menu na dosah i uprostřed dlouhé stránky. DS zná jen .HeaderView…fixed.
       Výšku hlavičky měří logika do --tp-header-h (na mobilu má dva řádky). */
    /* Náplasti hlavičky (našeptávač, přihlášení, z-index) nese komponenta
       komponenty/global/HeaderView.dc.html — tady se neopakují. */
    ._menuWrap { position: sticky; top: var(--tp-header-h, 0px); z-index: calc(var(--z-header) - 1); }
    /* CHYBÍ V DS: přihlášení nemá v hlavičce vlastní spouštěč — overlay otevírá
       „Rychlý nákup“ a odkaz v horním pruhu. .LoginUserView tu tedy slouží jen jako
       nositel panelu (DS ji navíc pod 820 px skrývá, což by panel na mobilu vypnulo). */
    /* align-self: stretch dá nositeli výšku řádku hlavičky, aby panel spadl pod
       tlačítka jako košík — nulová výška by ho posadila přes ně. */
    /* Nositel nemá vlastní spouštěč, takže by měl nulovou výšku a DS pravidlo
       ._headerPopup { top: calc(100% + 8px) } by panel posadilo přes tlačítka.
       display: contents nositele vyřadí z layoutu a panel se ukotví k liště nástrojů. */
    .HeaderView dc-con.dcHeader { position: relative; }
    .HeaderView .LoginUserView { display: contents; }
    /* CHYBÍ V DS: na displeji pod 550 px má být přihlášení přes celou obrazovku,
       stejně jako .BasketProductsPopupView (css/global.css @media max-width 549). */
    @media (max-width: 549px) {
      .LoginPopupView {
        position: fixed; inset: 0; top: 0; width: 100%;
        border-radius: 0; box-shadow: none;
        display: none; flex-direction: column;
        z-index: var(--z-overlay);
      }
      .active > .LoginPopupView, .LoginPopupView.active { display: flex; }
      .LoginPopupView > dc-con.dcContent { flex: 1 1 auto; max-height: none; }
      /* Nadpis na samostatném řádku pod lištou tlačítek — na mobilu je vedle
         „Zpět do obchodu“ a křížku moc těsno. */
      .LoginPopupView > dc-con.dcHeader { flex-wrap: wrap; }
      .LoginPopupView > dc-con.dcHeader .caption { order: 2; flex: 1 1 100%; margin-top: var(--spacer-8); }
      .LoginPopupView .button.back {
        display: inline-flex; order: -1; margin-right: auto;
        --btn-bg-color: transparent; --btn-bg-color-hover: var(--color-neutral-100);
        --btn-text-color: var(--color-main-600); --btn-text-color-hover: var(--color-main-700);
        padding: 0 var(--spacer-8);
      }
    }
    /* Strop šířky hero nese komponenta home/HeroBannerView. */
    /* CHYBA V DS: .fixed dává hlavičce --z-header (100) a zakládá stacking kontext,
       takže panel našeptávače (250 uvnitř) skončí pod lištou kategorií. Přilepená
       hlavička musí být nad ní. */
    .HeaderView.isFixedHeaderAware.fixed { z-index: var(--z-header-popup); }
  </style>
</helmet>

<dc-import name="komponenty/global/UserContentPanelView"
  usp="{{ topbarUsp }}" links="{{ topbarLinks }}" current="{{ uspCurrent }}"

<dc-import name="komponenty/global/HeaderView"

  empty-text="Zkuste kód náplně, například CF279A, nebo název tiskárny." show-all-href="#hledani"

  has-basket-popup="{{ true }}" basket-open="{{ basketOpen }}" basket-active="{{ basketActive }}"
  cart-count="{{ cartCount }}" cart-total="{{ cartTotal }}" cart-items-label="{{ cartItemsLabel }}"
  cart-items="{{ cartItems }}" has-cart="{{ hasCart }}" cart-empty="{{ cartEmpty }}" toggle-basket="{{ toggleBasket }}"

        <button type="button" class="button page next" aria-label="Další produkty" onClick="{{ carouselNext }}" disabled="{{ nextDisabled }}"><svg class="icon ico2" aria-hidden="true"><use href="#tp-chevron-right"></use></svg></button>

<dc-import name="komponenty/global/FooterView"
  about-caption="O Tonerprint" about-text="Jsme česká společnost s tradicí od 90. let. Pomáháme kancelářím, školám, firmám i domácnostem nakupovat efektivněji — kvalitní produkty, férové ceny a lidský přístup."
  copyright="© 2026 Tonerprint.cz" claim="Tvoříme dobré pracovní prostředí"
  email="{{ email }}" error="{{ error }}" sent="{{ sent }}" on-email-change="{{ onEmailChange }}" on-subscribe="{{ onSubscribe }}"
  hint-size="100%,420px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showDsGaps&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Kontrola DS&quot;}}">
class Component extends DCLogic {
  state = {
    mega: false, email: '', error: '', sent: false, atStart: true, atEnd: false,
    q: '', searchOpen: false, basketOpen: false, loginOpen: false, cart: [], usp: 0, qtys: {},
  };

  /* Pod 820 px se výhody v topbaru střídají po 5 s (DS: TopUtilityBar). Šipka
     posune ručně a časovač se restartuje; při prefers-reduced-motion neběží. */
  startUsp() {
    clearInterval(this.uspTimer);
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    this.uspTimer = setInterval(() => this.setState(s => ({ usp: (s.usp + 1) % 4 })), 5000);
  }
  uspStep(d) {
    this.setState(s => ({ usp: (s.usp + d + 4) % 4 }));
    this.startUsp();
  }

  /* Servisní pruh — markup drží komponenta UserContentPanelView. */
  topbar = {
    "usp": [
      {
        "icon": "#tp-building-store",
        "label": "Česká společnost od 90. let"
      },
      {
        "icon": "#tp-truck-delivery",
        "label": "Doprava zdarma od 1 500 Kč"
      },
      {
        "icon": "#tp-clock",
        "label": "Odesíláme do 24 h"
      },
      {
        "icon": "#tp-flag",
        "label": "Více než 30 let zkušeností"
      }
    ],
    "links": [
      {
        "label": "O nás",
        "href": "#o-nas"
      },
      {
        "label": "Poradna",
        "href": "#poradna"
      },
      {
        "label": "Kontakt",
        "href": "#kontakt"
      }
    ]
  };




  /* Katalog pro našeptávač a košík — prototyp, ne data z BS Shopu. */
  catalog = [
    { code: 'CF279A', key: 'cf279a', name: 'Kompatibilní toner HP CF279A (79A), černý, 1 000 stran', price: 479, image: 'ds/assets/produkty/toner-hp-cf279a.jpg', availability: 'Skladem 112 ks' },
    { code: 'CF226X', key: 'cf226x', name: 'Kompatibilní toner HP CF226X (26X), černý, 9 000 stran', price: 589, image: 'ds/assets/produkty/toner-hp-cf226x.jpg', availability: 'Skladem 96 ks' },
    { code: 'TN-2411', key: 'tn2411', name: 'Kompatibilní toner Brother TN-2411, černý, 1 200 stran', price: 349, image: 'ds/assets/produkty/toner-brother-tn2411.jpg', availability: 'Skladem 180 ks' },
    { code: 'CRG-039H', key: 'crg039h', name: 'Kompatibilní toner Canon CRG-039H, černý, 25 000 stran', price: 1290, image: 'ds/assets/produkty/toner-canon-crg039h.jpg', availability: 'Skladem 24 ks' },
    { code: 'LF-A4-80', key: 'lfa480', name: 'Laminovací fólie A4, 80 mic, 100 ks', price: 129, image: 'ds/assets/produkty/laminovaci-folie-a4.jpg', availability: 'Skladem 340 ks' },
    { code: 'AT-13C', key: 'at13c', name: 'Skartovačka papíru AT-13C, 13 listů, křížový řez', price: 2490, image: 'ds/assets/produkty/skartovacka-at-13c.jpg', availability: 'Skladem 8 ks' },
    { code: 'PW-TINA-CE', key: 'tina', name: 'Kancelářská židle Tina, ergonomická, černá', price: 2990, image: 'ds/assets/produkty/kreslo-tina-cerne.jpg', availability: 'Skladem 18 ks' },
  ];

  /* DS Price.prompt.md: mezera jako oddělovač tisíců, „Kč“ za číslem, vždy celé koruny. */
  price(n) { return Math.round(n).toLocaleString('cs-CZ').replace(/\u00a0/g, ' ') + ' Kč'; }

  norm(s) { return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

  matches(q) {
    const n = this.norm(q.trim());
    if (!n) return [];
    return this.catalog.filter(p => this.norm(p.name).includes(n) || this.norm(p.code).includes(n));
  }

  /* Číselník na kartě (DS ProductCard): počet drží karta, do košíku jde tolik kusů. */
  setQty(key, n) {
    const v = Math.min(999, Math.max(1, n || 1));
    this.setState(s => ({ qtys: { ...s.qtys, [key]: v } }));
  }
  qtyOf(key) { return this.state.qtys[key] ?? 1; }

  addToCart(key) {
    const p = this.catalog.find(x => x.key === key);
    if (!p) return;
    const add = this.qtyOf(key);
    this.setState(s => {
      const cart = s.cart.slice();
      const at = cart.findIndex(i => i.key === key);
      if (at >= 0) cart[at] = { ...cart[at], qty: cart[at].qty + add };
      else cart.push({ key, qty: add });
      return { cart, basketOpen: true, searchOpen: false };
    });
  }

  removeFromCart(key) { this.setState(s => ({ cart: s.cart.filter(i => i.key !== key) })); }

  itemsLabel(n) { return n === 1 ? '1 produkt' : n < 5 ? n + ' produkty' : n + ' produktů'; }

  renderVals() {
    const found = this.matches(this.state.q);
    const cart = this.state.cart.map(i => ({ ...this.catalog.find(p => p.key === i.key), qty: i.qty }));
    const count = cart.reduce((n, i) => n + i.qty, 0);
    const total = cart.reduce((n, i) => n + i.price * i.qty, 0);
    const gaps = this.props.showDsGaps ?? false;
    const cardKeys = ['cf279a', 'lfa480', 'tina', 'cf226x', 'tn2411'];
    return {
      topbarUsp: this.topbar.usp,
      topbarLinks: this.topbar.links,
      uspCurrent: this.state.usp,
      megaOpen: this.state.mega,
      megaDisplay: this.state.mega ? 'block' : 'none',
      toggleMega: () => this.setState(s => ({ mega: !s.mega })),
      uspPrev: () => this.uspStep(-1),
      uspNext: () => this.uspStep(1),

      /* --- vyhledávání s našeptávačem --- */
      q: this.state.q,
      searchActive: this.state.searchOpen && this.state.q.trim() ? 'active' : '',
      onQuery: e => this.setState({ q: e.target.value, searchOpen: true, basketOpen: false }),
      openSearch: () => this.setState({ searchOpen: true, basketOpen: false }),
      clearQuery: () => this.setState({ q: '', searchOpen: false }),
      whisper: found.slice(0, 6).map(p => {
        const at = this.norm(p.name).indexOf(this.norm(this.state.q.trim()));
        const len = this.state.q.trim().length;
        return {
          ...p,
          price: this.price(p.price),
          availClass: 'cs_zelena',
          pre: at < 0 ? p.name : p.name.slice(0, at),
          hit: at < 0 ? '' : p.name.slice(at, at + len),
          post: at < 0 ? '' : p.name.slice(at + len),
          buy: () => this.addToCart(p.key),
        };
      }),
      asideCategories: [
        { label: 'Tonery', value: '1 284', href: 'vypis-kategorie.dc.html' },
        { label: 'Inkoustové náplně', value: '642', href: 'vypis-kategorie.dc.html' },
        { label: 'Papír do tiskáren', value: '208', href: 'vypis-kategorie.dc.html' },
      ],
      asideManufacturers: [
        { label: 'HP', value: '412', href: 'vypis-kategorie.dc.html' },
        { label: 'Canon', value: '318', href: 'vypis-kategorie.dc.html' },
        { label: 'Brother', value: '286', href: 'vypis-kategorie.dc.html' },
      ],
      whisperCount: found.length,
      hasWhisper: found.length > 0,
      noWhisper: found.length === 0,

      /* --- košík v hlavičce --- */
      basketOpen: this.state.basketOpen,
      basketActive: this.state.basketOpen ? 'active' : '',
      basketEmptyClass: count ? '' : 'empty',
      toggleBasket: e => { e.preventDefault(); this.setState(s => ({ basketOpen: !s.basketOpen, searchOpen: false, loginOpen: false })); },
      closePopups: () => this.setState({ basketOpen: false, searchOpen: false, loginOpen: false }),

      /* Přihlášení: spouští ho ikona v hlavičce, „Rychlý nákup“ (bez účtu ho nejde
         použít) i odkaz v horním pruhu. Panel žije v .LoginUserView jako ._headerPopup. */
      loginOpen: this.state.loginOpen,
      loginActive: this.state.loginOpen ? 'active' : '',
      toggleLogin: e => { e.preventDefault(); this.setState(s => ({ loginOpen: !s.loginOpen, basketOpen: false, searchOpen: false })); },
      cartCount: count,
      cartTotal: this.price(total),
      cartItemsLabel: this.itemsLabel(count),
      cartItems: cart.map(it => ({
        ...it,
        quantityLabel: it.qty + ' × ' + this.price(it.price),
        lineTotal: this.price(it.price * it.qty),
        remove: () => this.removeFromCart(it.key),
      })),
      hasCart: cart.length > 0,
      cartEmpty: cart.length === 0,
      carouselRef: this.setScroller,
      carouselPrev: () => this.scrollStep(-1),
      carouselNext: () => this.scrollStep(1),
      onCarouselScroll: e => this.syncEdges(e.target),
      prevDisabled: this.state.atStart,
      nextDisabled: this.state.atEnd,
      /* DS ProductCarousel skryje footer navigaci, když se nedá scrollovat ani jedním směrem. */
      navHidden: this.state.atStart && this.state.atEnd,

      email: this.state.email,
      error: this.state.error,
      sent: this.state.sent,
      notSent: !this.state.sent,
      hasError: !!this.state.error,
      emailErrorClass: this.state.error ? 'error' : '',
      emailInvalid: this.state.error ? 'true' : undefined,
      emailDescribedBy: this.state.error ? 'newsletter-error' : undefined,
      onEmailChange: e => this.setState({ email: e.target.value, error: '' }),
      onSubscribe: () => {
        const v = this.state.email.trim();
        if (v.includes('@')) this.setState({ sent: true, error: '' });
        else this.setState({ error: 'E-mail musí obsahovat @.' });
      },

      toggleColumn: e => {
        const col = e.currentTarget.parentElement;
        const open = col.classList.toggle('expanded');
        e.currentTarget.setAttribute('aria-expanded', String(open));
      },

      /* Karusel bere produkty z katalogu; markup drží komponenta ProductView. */
      carousel: cardKeys.map(k => {
        const p = this.catalog.find(x => x.key === k);
        return {
          ...p,
          priceVat: this.price(p.price),
          priceNoVat: this.price(p.price / 1.21),
          availClass: 'cs_zelena',
          unit: 'ks',
          qty: this.qtyOf(k),
          inc: () => this.setQty(k, this.qtyOf(k) + 1),
          dec: () => this.setQty(k, this.qtyOf(k) - 1),
          setQty: e => this.setQty(k, parseInt(e.target.value, 10)),
          buy: () => this.addToCart(k),
        };
      }),
      buy: Object.fromEntries(cardKeys.map(k => [k, () => this.addToCart(k)])),
      qty: Object.fromEntries(cardKeys.map(k => [k, {
        value: this.qtyOf(k),
        inc: () => this.setQty(k, this.qtyOf(k) + 1),
        dec: () => this.setQty(k, this.qtyOf(k) - 1),
        set: e => this.setQty(k, parseInt(e.target.value, 10)),
      }])),
    };
  }

  /* Stabilní ref: renderVals() se volá při každém renderu, a nová funkce by React
     nejdřív odpojil (el === null). Klik na šipku mění atStart → render → ref null
     → scrollStep() nemá scroller. Proto jedna instance a null se ignoruje. */
  setScroller = el => { if (el) this.scroller = el; };

  scrollStep(dir) {
    const el = this.scroller;
    if (!el) return;
    const first = el.firstElementChild;
    const step = first ? first.getBoundingClientRect().width + 16 : 240;
    /* Bez behavior: 'smooth' — programové smooth scrollování se scroll-snap-type:
       x mandatory (home.css) startuje s velkým zpožděním a snap ho vrátí zpět.
       Instantní posun snap dorovná sám. */
    el.scrollBy({ left: dir * step });
    /* Poslední krok se clampne na konec rozsahu a nevyvolá žádný scroll event,
       takže se kraje musí doměřit až po usazení pozice: scrollend, s pojistkou
       na 300 ms (v prohlížečích bez scrollend nebo když se pozice nezmění). */
    clearTimeout(this.edgeTimer);
    const settle = () => {
      clearTimeout(this.edgeTimer);
      el.removeEventListener('scrollend', settle);
      this.syncEdges(el);
    };
    el.addEventListener('scrollend', settle);
    this.edgeTimer = setTimeout(settle, 300);
  }

  /* Jediné místo, kde se počítají krajní stavy obou navigací. Měří se z reálného
     rozsahu scrollu — dokud se karty (a jejich fotky) nedoměří, je rozsah nulový
     a „vpřed“ se nesmí zamknout, jinak už ho žádný scroll event neodemkne. */
  syncEdges(el) {
    if (!el) return;
    const max = el.scrollWidth - el.clientWidth;
    const atStart = el.scrollLeft < 8;
    const atEnd = max > 8 && el.scrollLeft >= max - 8;
    if (atStart !== this.state.atStart || atEnd !== this.state.atEnd) this.setState({ atStart, atEnd });
  }

  /* React lowercases className na custom elementech (dc-con → classname="…"),
     takže selektory BS Shopu .View > dc-con.dcContent nesedí. Přeneseme to na class
     jen jednou, aby ruční přepínání .expanded v patičce zůstalo zachované. */
  syncCustomElementClasses() {
    document.querySelectorAll('dc-con, dc-gi, bs-lazy-render').forEach(el => {
      const v = el.getAttribute('classname');
      if (v && !el.getAttribute('class')) el.setAttribute('class', v);
    });
  }

  /* Přilepení hlavičky a měření --tp-header-h řeší komponenta HeaderView. */

  componentDidMount() {
    this.syncCustomElementClasses();
    this.startUsp();
    this.syncEdges(this.scroller);
    this.onResize = () => this.syncEdges(this.scroller);
    window.addEventListener('resize', this.onResize);
    window.addEventListener('load', this.onResize);
    /* Panely hlavičky (našeptávač, přihlášení, košík) se zavírají klikem mimo
       svého nositele a klávesou Esc — jinak by na dotyku zůstaly viset. */
    this.onDocDown = e => {
      const inSearch = e.target.closest && e.target.closest('.SimpleSearchView');
      const inBasket = e.target.closest && e.target.closest('.SimpleBasketView');
      const inLogin = e.target.closest && e.target.closest('.LoginUserView, ._quickBuy, .UserContentPanelView');
      if (!inSearch && this.state.searchOpen) this.setState({ searchOpen: false });
      if (!inBasket && this.state.basketOpen) this.setState({ basketOpen: false });
      if (!inLogin && this.state.loginOpen) this.setState({ loginOpen: false });
    };
    this.onKeyDown = e => {
      if (e.key !== 'Escape') return;
      if (this.state.searchOpen || this.state.basketOpen || this.state.mega || this.state.loginOpen) {
        this.setState({ searchOpen: false, basketOpen: false, mega: false, loginOpen: false });
      }
    };
    document.addEventListener('mousedown', this.onDocDown);
    document.addEventListener('keydown', this.onKeyDown);
    /* Rozsah scrollu se mění i bez resize okna — dokud se nedoměří fotky karet,
       je nulový. ResizeObserver hlídá kontejner i kartu a stav dorovná. */
    if (this.scroller && window.ResizeObserver) {
      this.ro = new ResizeObserver(() => this.syncEdges(this.scroller));
      this.ro.observe(this.scroller);
      if (this.scroller.firstElementChild) this.ro.observe(this.scroller.firstElementChild);
    }
  }
  componentWillUnmount() {
    clearInterval(this.uspTimer);
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('load', this.onResize);
    document.removeEventListener('mousedown', this.onDocDown);
    document.removeEventListener('keydown', this.onKeyDown);
    if (this.ro) this.ro.disconnect();
  }
  componentDidUpdate() { this.syncCustomElementClasses(); }
}

</script>
</body>
</html>
