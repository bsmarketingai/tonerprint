<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="ds/styles.css">
  <script src="ds/assets/icons/sprite.js"></script>
  <style>
    /* Náplasti hlavičky nese komponenta komponenty/global/HeaderView.dc.html. */
    body { background: var(--bg-color); color: var(--text-color); font: var(--font-weight-regular) var(--font-size-14) / var(--line-height-base) var(--font-family); margin: 0; }
    a { color: var(--link-color); text-decoration: none; }
    a:hover { color: var(--link-color-hover); text-decoration: underline; }
    /* Obchází runtime, ne DS: host má height: 100 %, takže obsah přetéká mimo svůj
       containing block a sticky hlavička se po ~456 px odlepí. */
    html, body { height: auto; min-height: 100%; }
    #dc-root, #dc-root > .sc-host { height: auto; min-height: 100%; }
    /* CHYBÍ V DS: přilepená má zůstat hlavička i lišta kategorií — menu musí být
       na dosah i uprostřed dlouhé stránky. Výšku hlavičky měří logika
       do --tp-header-h (na mobilu má hlavička dva řádky). */
    ._menuWrap { position: sticky; top: var(--tp-header-h, 0px); z-index: calc(var(--z-header) - 1); }
    /* CHYBÍ V DS: pro detail produktu není obal stránky. .CategoryView drží rytmus
       --eshop-gap (16 px), což je správné pro výpis (lišta, mřížka, stránkování),
       ale detail má tři samostatné bloky (sestava, karusel, taby) a ty chtějí
       --section-gap jako sekce homepage. V DS chce ProductDetailView / DetailView. */
    .CategoryView { padding-top: var(--eshop-gap); gap: var(--section-gap); }
    .CategoryView .BreadcrumbView { margin-bottom: calc(-1 * var(--section-gap) + var(--eshop-gap)); }
    /* CHYBÍ V DS (rozhodnuto): vlajky mají větnou velikost písmen a menší text —
       tokeny --flag-text-transform: uppercase a --flag-font-size: 12 dělají z krátkých
       textů („Doprava zdarma“) hlasitý blok. Do DS patří none + 12 px a lehčí řez.
       Pod 12 px se nejde — tokens/typography.css říká, že 11 px je jen pro chrome
       styleguidu, v produktovém UI je minimum 12 px (a11y). */
    :root { --flag-text-transform: none; --flag-font-size: var(--font-size-12); --flag-font-weight: var(--font-weight-semibold); }
    /* CHYBA V DS: .ProductView .image .mainImage má mix-blend-mode: multiply a vlajky
       (.ActionIconsView) jsou v DOM před obrázkem — fotka se s nimi tedy násobí a vlajka
       vypadá ztmavená a průhledná. V DS má mít .ActionIconsView z-index a isolation,
       ať blending zůstane jen mezi fotkou a bílým podkladem karty. */
    .ProductView .image .ActionIconsView { z-index: 1; isolation: isolate; }
    /* Výchozí karta (číselník + ikonové CTA) i čtvercová tlačítka číselníku už jsou v DS
       (update 2026-08-25) — zůstává jen písmo jednotky. */
    .ProductView .AddToCartView .quantity .unitsDescription { font: var(--font-weight-bold) var(--font-size-14) var(--font-family); color: var(--text-color); }
    /* CHYBÍ V DS: číselník nemá obal pro dvojici číslo + jednotka, takže „1 bal“ nejde
       vycentrovat — odsazení paddingem vždy posune pár mimo osu. Na stránce je obal
       span.value: jedna položka, která dobírá zbytek řádku a obsah centruje.
       V DS chce .quantity > .value { flex: 1; justify-content: center }. */
    .AddToCartView .quantity > .value { flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; gap: var(--spacer-2); min-width: 0; }
    .AddToCartView .quantity > .value .real,
    .ProductView > dc-con.dcContent .AddToCartView .quantity > .value .real {
      flex: none; width: var(--spacer-24); field-sizing: content;
      min-width: var(--spacer-12); text-align: right; padding: 0;
    }
    .AddToCartView .quantity > .value .unitsDescription,
    .ProductView > dc-con.dcContent .AddToCartView .quantity > .value .unitsDescription { flex: none; padding: 0; }
    .ProductView > dc-con.dcContent .AddToCartView .quantity > .value { flex: 1 1 auto; }
    /* CHYBÍ V DS: číselník na detailu má jednotku vedle čísla stejně jako na kartě
       („1 ks“) a čtvercová tlačítka — DS to má jen jako popisek pod číselníkem. */
    .ProductDetailMasterView .AddToCartView .quantity .button { width: var(--btn-min-height); min-width: var(--btn-min-height); padding: 0; }
    .ProductDetailMasterView .AddToCartView .quantity > .value .real { flex: none; min-width: 0; text-align: right; padding: 0; }
    .ProductDetailMasterView .AddToCartView .quantity > .value .unitsDescription { flex: none; padding: 0; font: var(--font-weight-bold) var(--font-size-14) var(--font-family); color: var(--text-color); }
    .ProductDetailMasterView .AddToCartView .quantity { flex: none; }
    .ProductDetailMasterView .AddToCartView { flex-wrap: wrap; }
    .ProductDetailMasterView .AddToCartView .button.buy { flex: 1 1 auto; min-width: 0; }
    /* CHYBÍ V DS: identifikační tabulka (Kód, EAN, PN, Výrobce, Záruka) stojí na detailu
       nad akcemi, ne v tabu Parametry. ProductDetailTableView v2a je stylovaná jako blok
       s bílým podkladem a nadpisem; tady se používá bez nadpisu, jako tichý pás.
       V DS chce vlastní modifikátor (např. v2a.identity) místo page overridu. */
    .ProductDetailTableView.v2a.identity { padding: var(--spacer-4) var(--spacer-16); }
    .ProductDetailTableView.v2a.identity bs-grid-item { padding: var(--spacer-2) 0; border-bottom: 0; font-size: var(--font-size-12); line-height: var(--line-height-tight); }
    .ProductDetailTableView.v2a.identity bs-grid-item .caption { font-size: var(--font-size-12); }
    .ProductDetailTableView.v2a.identity bs-grid-item .value { font-size: var(--font-size-12); font-weight: var(--font-weight-semibold); }
    /* CHYBÍ V DS: tabulka parametrů je v DS 14 px a to je na dlouhý seznam moc —
       parametry jsou metadata, ne čtený text. V DS chce bs-grid-item 13 px
       (popisek muted, hodnota semibold), stejně jako identifikační pás. */
    /* CHYBÍ V DS: taby detailu jsou 14 px semibold, což na hlavní navigaci obsahu
       nestačí — jsou to nadpisy sekcí, ne odkazy v liště. V DS chtějí 16 px bold. */
    .TabsProductDetailMasterView .tabs > .page { font-size: var(--font-size-16); font-weight: var(--font-weight-bold); padding: var(--spacer-10) var(--spacer-16); }
    .TabsProductDetailMasterView bs-grid-item { padding: var(--spacer-8) 0; font-size: var(--font-size-13); }
    /* CHYBA V DS: `.ProductDetailTableView.v2a .caption { font-size: 18px; font-weight: bold }`
       je pravidlo pro nadpis bloku, ale trefuje i popisky řádků `bs-grid-item .caption` —
       a to má nižší specificitu (0,1,1 vs 0,2,0), takže parametry mají popisek 18 px bold.
       V DS má být nadpis bloku vázaný přímo (`.v2a > .caption`). */
    .ProductDetailTableView.v2a bs-grid-item .caption { font-size: var(--font-size-13); font-weight: var(--font-weight-regular); color: var(--text-color-muted); margin: 0; }
    .ProductDetailTableView.v2a bs-grid-item .value { font-size: var(--font-size-13); }
    .ProductDetailTableView.v2a.identity bs-grid-item .caption,
    .ProductDetailTableView.v2a.identity bs-grid-item .value { font-size: var(--font-size-12); }
    /* Náplast na podklad krátkého popisu nese komponenta detail/ProductDescriptionView. */
    /* ProductCarouselView už sám drží ._eshopWidth (max-width + padding), uvnitř
       ._eshopWidth by se padding sčítal. */
    ._eshopWidth > .ProductCarouselView { padding-inline: 0; }
  </style>
</helmet>

  empty-text="Zkuste kód produktu, například AT-13C, nebo název zařízení." show-all-href="vypis-kategorie.dc.html"

<main class="CategoryView _eshopWidth" id="produkt">

  <div class="ProductDetailMasterView ProductDetailMasterViewBase v1a v1 bs-view dcon dc000">
    <dc-import name="komponenty/detail/ProductDetailImageView"
      shown0="{{ shown0 }}" shown1="{{ shown1 }}" shown2="{{ shown2 }}" shown3="{{ shown3 }}" shown4="{{ shown4 }}" shown5="{{ shown5 }}" shown6="{{ shown6 }}" shown7="{{ shown7 }}" shown8="{{ shown8 }}" gallery-prev="{{ galleryPrev }}" gallery-next="{{ galleryNext }}" gallery="{{ gallery }}"

<dc-import name="komponenty/global/FooterView"

  copyright="© 2026 Tonerprint.cz" claim="Tvoříme dobré pracovní prostředí"
  hint-size="100%,420px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { usp: 0, gallery: 0, qty: 1, tab: 0, fav: false, cart: [], qtys: {}, atStart: true, atEnd: false, mega: false, loginOpen: false, q: '', searchOpen: false };

  photos = [
    { src: 'assets/at13c/1.jpg', alt: 'Skartovačka AT-13C zepředu' },
    { src: 'assets/at13c/2.jpg', alt: 'AT-13C v kanceláři u pracovního stolu' },
    { src: 'assets/at13c/3.jpg', alt: 'Vysunutý koš na odpad' },
    { src: 'assets/at13c/4.jpg', alt: 'Čelní pohled s okénkem koše' },
    { src: 'assets/at13c/5.jpg', alt: 'Ovládací panel shora' },
    { src: 'assets/at13c/6.jpg', alt: 'Vstup pro karty a CD' },
    { src: 'assets/at13c/7.jpg', alt: 'Chlazení motoru' },
    { src: 'assets/at13c/8.jpg', alt: 'Skartování u domácího stolu' },
    { src: 'assets/at13c/9.jpg', alt: 'Skartování CD a DVD' },
  ];

  norm(v) { return v.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
  found() {
    const n = this.norm(this.state.q.trim());
    if (!n) return [];
    return this.catalog.filter(p => this.norm(p.name).includes(n) || this.norm(p.code).includes(n));
  }

  /* Ceny v celých korunách (Price.prompt.md) — mezera jako oddělovač tisíců. */
  price(n) { return Math.round(n).toLocaleString('cs-CZ').replace(/\u00a0/g, ' ') + ' Kč'; }

  catalog = [
    { key: 'at13c', code: 'AT-13C', name: 'Skartovačka papíru AT-13C, 13 listů', priceVat: 3928, priceNoVat: 3246, unit: 'ks', image: 'assets/at13c/1.jpg' },
    { key: 'olej', code: 'AT-OIL', name: 'Olejové papíry AT pro skartovací stroje', desc: 'Údržba řezného mechanismu — jeden papír na 30 minut provozu.', priceVat: 320, priceNoVat: 264, image: 'ds/assets/produkty/laminovaci-folie-a4.jpg', avail: 'Na dotaz', availClass: 'cs_zluta', unit: 'bal', flag: 'Doporučujeme', flagClass: 'flag02' },
    { key: 'at10c', code: 'AT-10C', name: 'Skartovačka papíru AT-10C, 10 listů, křížový řez 4 × 35 mm', desc: 'Menší model pro domácí pracovnu, koš 18 l.', priceVat: 1965, priceNoVat: 1624, image: 'ds/assets/produkty/skartovacka-at-13c.jpg', avail: 'Skladem 14 ks', availClass: 'cs_zelena', unit: 'ks', flag: 'Doporučujeme', flagClass: 'flag02' },
    { key: 'slim-p4', code: 'AT-SL-P4', name: 'Skartovačka AT Slimline S (P4), 9 listů, křížový řez 4 × 15 mm', desc: 'Vyšší stupeň bezpečnosti pro osobní údaje.', priceVat: 3638, priceNoVat: 3007, image: 'ds/assets/produkty/skartovacka-at-13c.jpg', avail: 'Skladem 6 ks', availClass: 'cs_zelena', unit: 'ks' },
    { key: 'at6s', code: 'AT-6S', name: 'Skartovačka papíru AT-6S, 10 listů, proužek 6 mm', desc: 'Nejlevnější varianta pro běžné dokumenty.', priceVat: 1019, priceNoVat: 842, image: 'ds/assets/produkty/skartovacka-at-13c.jpg', avail: 'Skladem 22 ks', availClass: 'cs_zelena', unit: 'ks' },
    { key: 'slim-p5', code: 'AT-SL-P5', name: 'Skartovačka AT Slimline S (P5), 5 listů, křížový řez 2 × 15 mm', desc: 'Stupeň P-5 pro citlivé dokumenty.', priceVat: 4483, priceNoVat: 3705, image: 'ds/assets/produkty/skartovacka-at-13c.jpg', avail: 'Skladem 5 ks', availClass: 'cs_zelena', unit: 'ks', flag: 'Doprava zdarma', flagClass: 'flag05' },
  ];

  startUsp() {
    clearInterval(this.uspTimer);
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    this.uspTimer = setInterval(() => this.setState(s => ({ usp: (s.usp + 1) % 4 })), 5000);
  }
  uspStep(d) { this.setState(s => ({ usp: (s.usp + d + 4) % 4 })); this.startUsp(); }

  qtyOf(key) { return this.state.qtys[key] ?? 1; }
  setQty(key, n) {
    const v = Math.min(999, Math.max(1, n || 1));
    this.setState(s => ({ qtys: { ...s.qtys, [key]: v } }));
  }
  addToCart(key, qty) {
    const p = this.catalog.find(x => x.key === key);
    if (!p) return;
    this.setState(s => {
      const cart = s.cart.slice();
      const at = cart.findIndex(i => i.key === key);
      if (at >= 0) cart[at] = { ...cart[at], qty: cart[at].qty + qty };
      else cart.push({ key, qty });
      /* Stejné chování jako na homepage: po vložení se otevře panel košíku,
         aby zákazník viděl, co přidal, a našeptávač se zavře. */
      return { cart, basketOpen: true, searchOpen: false };
    });
  }
  itemsLabel(n) { return n === 1 ? '1 produkt' : n < 5 ? n + ' produkty' : n + ' produktů'; }

  setScroller = el => { if (el) this.scroller = el; };
  scrollStep(dir) {
    const el = this.scroller;
    if (!el) return;
    const first = el.firstElementChild;
    el.scrollBy({ left: dir * (first ? first.getBoundingClientRect().width + 16 : 240) });
    clearTimeout(this.edgeTimer);
    const settle = () => {
      clearTimeout(this.edgeTimer);
      el.removeEventListener('scrollend', settle);
      this.syncEdges(el);
    };
    el.addEventListener('scrollend', settle);
    this.edgeTimer = setTimeout(settle, 300);
  }

  /* Krajní stavy navigace karuselu — měří se z reálného rozsahu scrollu (dokud se
     fotky karet nedoměří, je nulový a „vpřed“ se nesmí zamknout). */
  syncEdges(el) {
    if (!el) return;
    const max = el.scrollWidth - el.clientWidth;
    const atStart = el.scrollLeft < 8;
    const atEnd = max > 8 && el.scrollLeft >= max - 8;
    if (atStart !== this.state.atStart || atEnd !== this.state.atEnd) this.setState({ atStart, atEnd });
  }

  renderVals() {
    const cart = this.state.cart.map(i => ({ ...this.catalog.find(p => p.key === i.key), qty: i.qty }));
    const count = cart.reduce((n, i) => n + i.qty, 0);
    const total = cart.reduce((n, i) => n + i.priceVat * i.qty, 0);
    const at = this.state.gallery;
    const tab = this.state.tab;
    return {
      /* Našeptávač: hledá v katalogu podle názvu i kódu, diakritika nerozhoduje. */
      q: this.state.q,
      searchActive: this.state.searchOpen && this.state.q.trim() ? 'active' : '',
      onQuery: e => this.setState({ q: e.target.value, searchOpen: true, loginOpen: false }),
      openSearch: () => this.setState({ searchOpen: true, loginOpen: false }),
      clearQuery: () => this.setState({ q: '', searchOpen: false }),
      whisper: this.found().slice(0, 6).map(p => {
        const q = this.state.q.trim();
        const at = this.norm(p.name).indexOf(this.norm(q));
        return {
          code: p.code, image: p.image,
          pre: at < 0 ? p.name : p.name.slice(0, at),
          hit: at < 0 ? '' : p.name.slice(at, at + q.length),
          post: at < 0 ? '' : p.name.slice(at + q.length),
          priceVat: this.price(p.priceVat),
          availability: p.avail, availClass: p.availClass,
          buy: () => this.addToCart(p.key, 1),
        };
      }),
      asideCategories: [
        { label: 'Kancelářská technika', value: '212', href: 'vypis-kategorie.dc.html' },
        { label: 'Skartovačky', value: '48', href: 'vypis-kategorie.dc.html' },
        { label: 'Laminace', value: '112', href: 'vypis-kategorie.dc.html' },
      ],
      asideManufacturers: [
        { label: 'AT', value: '61', href: 'vypis-kategorie.dc.html' },
        { label: 'Argo', value: '54', href: 'vypis-kategorie.dc.html' },
        { label: 'tesa', value: '38', href: 'vypis-kategorie.dc.html' },
      ],
      whisperCount: this.found().length,
      hasWhisper: this.found().length > 0,
      noWhisper: this.state.searchOpen && !!this.state.q.trim() && this.found().length === 0,
      loginOpen: this.state.loginOpen,
      loginActive: this.state.loginOpen ? 'active' : '',

      uspNext: () => this.uspStep(1),

      uspCurrent: this.state.usp,
      menuItems: this.menu.items,
      megaItems: this.menu.mega,
      megaFeatured: this.menu.featured,
      megaOpen: this.state.mega,
      megaDisplay: this.state.mega ? 'block' : 'none',
      toggleMega: () => this.setState(s => ({ mega: !s.mega })),

      basketOpen: this.state.basketOpen,

      basketActive: this.state.basketOpen ? 'active' : '',

      toggleBasket: e => { e.preventDefault(); this.setState(s => ({ basketOpen: !s.basketOpen, searchOpen: false, loginOpen: false })); },

      cartItems: cart.map(it => ({

        ...it,

        quantityLabel: it.qty + ' × ' + this.price(it.priceVat),

        lineTotal: this.price(it.priceVat * it.qty),

        remove: () => this.setState(st => ({ cart: st.cart.filter(i => i.key !== it.key) })),

      })),

      hasCart: cart.length > 0,

      cartEmpty: cart.length === 0,

      cartCount: count,
      cartTotal: this.price(total),
      cartItemsLabel: this.itemsLabel(count),
      basketEmptyClass: count ? '' : 'empty',

      /* Všechny fotky jsou v šabloně staticky (jako v DS kitu) — src nesmí být hole,
         jinak prohlížeč během streamu načítá literál. Přepíná se jen třída. */
      ...Object.fromEntries(this.photos.map((_, i) => ['shown' + i, i === at ? '' : 'hidden'])),
      gallery: this.photos.map((p, i) => ({
        src: p.src, alt: p.alt,
        cls: i === at ? 'selected' : '',
        select: e => { e.preventDefault(); this.setState({ gallery: i }); },
      })),
      galleryPrev: () => this.setState(s => ({ gallery: (s.gallery - 1 + this.photos.length) % this.photos.length })),
      galleryNext: () => this.setState(s => ({ gallery: (s.gallery + 1) % this.photos.length })),

      qty: this.state.qty,
      /* Šířka číselného pole podle počtu číslic — jinak zbyde v poli prázdné místo
         a dvojice „1 ks“ se opticky odsune od osy číselníku. */
      qtyWidth: String(this.state.qty).length + 'ch',
      qtyInc: () => this.setState(s => ({ qty: Math.min(999, s.qty + 1) })),
      qtyDec: () => this.setState(s => ({ qty: Math.max(1, s.qty - 1) })),
      qtySet: e => this.setState({ qty: Math.min(999, Math.max(1, parseInt(e.target.value, 10) || 1)) }),
      buy: () => this.addToCart('at13c', this.state.qty),

      favClass: this.state.fav ? 'active' : '',
      toggleFav: () => this.setState(s => ({ fav: !s.fav })),

      tab0: tab === 0 ? 'selected' : '',
      tab1: tab === 1 ? 'selected' : '',
      setTab0: () => this.setState({ tab: 0 }),
      setTab1: () => this.setState({ tab: 1 }),
      scrollToDescription: () => {
        this.setState({ tab: 0 });
        const el = document.getElementById('popis');
        if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 16, behavior: 'smooth' });
      },

      related: this.catalog.filter(p => p.key !== 'at13c').map(p => ({
        ...p,
        stateClass: 'canBuy',
        priceVat: this.price(p.priceVat),
        priceNoVat: this.price(p.priceNoVat),
        hasFlag: !!p.flag,
        flag: p.flag || '',
        flagClass: p.flagClass || '',
        availability: p.avail,
        availClass: p.availClass,
        qty: this.qtyOf(p.key),
        qtyWidth: String(this.qtyOf(p.key)).length + 'ch',
        inc: () => this.setQty(p.key, this.qtyOf(p.key) + 1),
        dec: () => this.setQty(p.key, this.qtyOf(p.key) - 1),
        setQty: e => this.setQty(p.key, parseInt(e.target.value, 10)),
        buy: () => this.addToCart(p.key, this.qtyOf(p.key)),
      })),
      carouselRef: this.setScroller,
      carouselPrev: () => this.scrollStep(-1),
      carouselNext: () => this.scrollStep(1),
      onCarouselScroll: e => this.syncEdges(e.target),
      prevDisabled: this.state.atStart,
      nextDisabled: this.state.atEnd,
      navHidden: this.state.atStart && this.state.atEnd,

      toggleColumn: e => {
        const col = e.currentTarget.parentElement;
        const open = col.classList.toggle('expanded');
        e.currentTarget.setAttribute('aria-expanded', String(open));
      },
    };
  }

  componentDidMount() {
    document.addEventListener('mousedown', this.closeOnOutside);
    this.syncCustomElementClasses();
    this.startUsp();
    this.onKeyDown = e => {
      if (e.key !== 'Escape') return;
      if (this.state.mega || this.state.searchOpen || this.state.loginOpen) this.setState({ mega: false, searchOpen: false, loginOpen: false });
    };
    document.addEventListener('keydown', this.onKeyDown);
    /* Rozsah scrollu je nulový, dokud se nedoměří fotky karet — proto i resize
       a ResizeObserver, ne jen jedno měření po mountu (stejně jako homepage). */
    this.syncEdges(this.scroller);
    this.onResize = () => this.syncEdges(this.scroller);
    window.addEventListener('resize', this.onResize);
    window.addEventListener('load', this.onResize);
    if (this.scroller && window.ResizeObserver) {
      this.ro = new ResizeObserver(() => this.syncEdges(this.scroller));
      this.ro.observe(this.scroller);
      if (this.scroller.firstElementChild) this.ro.observe(this.scroller.firstElementChild);
    }
  }
  componentDidUpdate() { this.syncCustomElementClasses(); }
  componentWillUnmount() {
    clearInterval(this.uspTimer);
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('load', this.onResize);
    document.removeEventListener('keydown', this.onKeyDown);
    document.removeEventListener('mousedown', this.closeOnOutside);
    if (this.ro) this.ro.disconnect();
  }
