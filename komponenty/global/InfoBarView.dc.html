<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { background: var(--bg-color); color: var(--text-color); font: var(--font-weight-regular) var(--font-size-14) / var(--line-height-base) var(--font-family); margin: 0; }
    a { color: var(--link-color); text-decoration: none; }
    a:hover { color: var(--link-color-hover); text-decoration: underline; }
    /* CHYBÍ V DS: informační lišta nad celou stránkou. Oranžová (--color-warning-500)
       s tmavým textem, aby se odlišila od tmavě modrého servisního pruhu pod ní. */
    ._infoBar { background: var(--color-warning-500); color: var(--color-on-warning-500); }
    ._infoBar > .dcContent {
      display: flex; align-items: center; justify-content: center; gap: var(--spacer-12);
      max-width: var(--eshop-width); margin: 0 auto; box-sizing: border-box;
      min-height: var(--spacer-40); padding: var(--spacer-6) var(--spacer-8) var(--spacer-6) var(--spacer-16);
    }
    ._infoBar .text { margin: 0; line-height: var(--line-height-tight); flex: 1 1 auto; text-align: center; font-size: var(--font-size-14); font-weight: var(--font-weight-semibold); text-wrap: pretty; }
    ._infoBar .text strong { font-weight: var(--font-weight-extrabold); }
    ._infoBar .button.close {
      flex: none; width: var(--spacer-32); min-width: var(--spacer-32); min-height: var(--spacer-32); padding: 0;
      --btn-bg-color: transparent; --btn-bg-color-hover: var(--color-warning-600);
      --btn-text-color: var(--color-on-warning-500); --btn-text-color-hover: var(--color-on-warning-600);
      --btn-border-width: 0; border-radius: var(--radius-pill);
    }
  </style>
</helmet>

<sc-if value="{{ visible }}" hint-placeholder-val="{{ true }}">
  <div class="_infoBar" role="status">
    <dc-con class="dcContent">
      <p class="text"><span aria-hidden="true">🎉</span> <strong>Spustili jsme nový design e-shopu.</strong> Budeme rádi za zpětnou vazbu.</p>
      <button type="button" class="button close" aria-label="Zavřít informaci" onClick="{{ close }}"><svg class="icon ico2" aria-hidden="true"><use href="#tp-x"></use></svg></button>
    </dc-con>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:48}}">
class Component extends DCLogic {
  /* Zavření platí do konce relace prohlížeče — při další návštěvě se lišta vrátí. */
  state = { closed: (() => { try { return sessionStorage.getItem('tp-infobar-closed') === '1'; } catch (e) { return false; } })() };
  renderVals() {
    return {
      visible: !this.state.closed,
      close: () => {
        try { sessionStorage.setItem('tp-infobar-closed', '1'); } catch (e) {}
        this.setState({ closed: true });
      },
    };
  }
  get standalone() { return location.pathname.includes('/komponenty/'); }
  dsPrefix() { return this.standalone ? '../../' : ''; }
  ensureDsAssets() {
    if (!document.querySelector('link[href$="ds/styles.css"]')) {
      const l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = this.dsPrefix() + 'ds/styles.css';
      document.head.appendChild(l);
    }
    if (!document.querySelector('#tpSprite') && !document.querySelector('script[src$="ds/assets/icons/sprite.js"]')) {
      const sc = document.createElement('script');
      sc.src = this.dsPrefix() + 'ds/assets/icons/sprite.js';
      document.head.appendChild(sc);
    }
  }
  syncCustomElementClasses() {
    document.querySelectorAll('dc-con').forEach(el => {
      const v = el.getAttribute('classname');
      if (v && !el.getAttribute('class')) el.setAttribute('class', v);
    });
  }
  componentDidMount() { this.ensureDsAssets(); this.syncCustomElementClasses(); }
  componentDidUpdate() { this.syncCustomElementClasses(); }
}
</script>
</body>
</html>
