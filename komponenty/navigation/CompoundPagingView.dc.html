<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { background: var(--bg-color); color: var(--text-color); font: var(--font-weight-regular) var(--font-size-14) / var(--line-height-base) var(--font-family); margin: 0; }
    a { color: var(--link-color); text-decoration: none; }
    a:hover { color: var(--link-color-hover); text-decoration: underline; }
  </style>
</helmet>

<div class="CompoundPagingView v1a v1 bs-view dcon dc000 bottom">
  <dc-con class="dcHeader">
    <sc-if value="{{ hasMore }}" hint-placeholder-val="{{ true }}">
      <button type="button" class="button nextProducts" onClick="{{ loadMore }}">{{ loadMoreLabel }}</button>
    </sc-if>
    <span class="totalItems">{{ shownLabel }}</span>
  </dc-con>
  <div class="pages">
    <button type="button" class="button page previous" aria-label="Předchozí stránka" disabled="{{ prevDisabled }}" onClick="{{ pagePrev }}"><svg class="icon ico2" aria-hidden="true"><use href="#tp-chevron-left"></use></svg></button>
    <sc-for list="{{ pages }}" as="pg" hint-placeholder-count="6">
      <button type="button" class="button page {{ pg.cls }}" onClick="{{ pg.go }}">{{ pg.label }}</button>
    </sc-for>
    <span class="separator">…</span>
    <button type="button" class="button page {{ lastCls }}" onClick="{{ goLast }}">24</button>
    <button type="button" class="button page next" aria-label="Další stránka" onClick="{{ pageNext }}"><svg class="icon ico2" aria-hidden="true"><use href="#tp-chevron-right"></use></svg></button>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  /* Obsah bloku drží komponenta — texty se upravují tady, ne na stránce.
     Data a akce přicházejí z props stránky pod stejnými názvy jako v šabloně. */
  get standalone() { return location.pathname.includes('/komponenty/'); }
  dsPrefix() { return this.standalone ? '../../' : ''; }
  fixStandalonePaths() {
    if (!this.standalone) return;
    document.querySelectorAll('img[src^="ds/"]').forEach(img => { img.src = '../../' + img.getAttribute('src'); });
  }
  ensureDsAssets() {
    if (!document.querySelector('link[href$="ds/styles.css"]')) {
      const l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = this.dsPrefix() + 'ds/styles.css';
      document.head.appendChild(l);
    }
    if (!document.querySelector('#tpSprite') && !document.querySelector('script[src$="ds/assets/icons/sprite.js"]')) {
      const sc = document.createElement('script');
      sc.src = this.dsPrefix() + 'ds/assets/icons/sprite.js';
      document.head.appendChild(sc);
    }
    this.fixStandalonePaths();
  }
  syncCustomElementClasses() {
    document.querySelectorAll('dc-con, dc-gi, bs-grid-cont, bs-grid-item').forEach(el => {
      const v = el.getAttribute('classname');
      if (v && !el.getAttribute('class')) el.setAttribute('class', v);
    });
  }
  componentDidMount() {
    this.ensureDsAssets();
    this.syncCustomElementClasses();
  }
  componentDidUpdate() { this.syncCustomElementClasses(); }
}
</script>
</body>
</html>
