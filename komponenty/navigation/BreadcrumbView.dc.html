<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { background: var(--bg-color); color: var(--text-color); font: var(--font-weight-regular) var(--font-size-14) / var(--line-height-base) var(--font-family); margin: 0; }
    a { color: var(--link-color); text-decoration: none; }
    a:hover { color: var(--link-color-hover); text-decoration: underline; }
    /* CHYBÍ V DS: první úroveň je ikona domečku, ne slovo „Úvod“. */
    .BreadcrumbView .path > li > a > .icon { display: block; }
  </style>
</helmet>

<nav class="BreadcrumbView v1a v1 bs-view dcon dc000" aria-label="Drobečková navigace">
  <ul class="path">
    <li><a href="{{ homeHref }}" aria-label="Úvod"><svg class="icon ico2" aria-hidden="true"><use href="#tp-home"></use></svg></a></li>
    <sc-for list="{{ crumbs }}" as="c" hint-placeholder-count="4">
      <li class="{{ c.modifier }}" aria-hidden="{{ c.ariaHidden }}">
        <sc-if value="{{ c.isSeparator }}">
          <svg class="icon"><use href="#tp-chevron-right"></use></svg>
        </sc-if>
        <sc-if value="{{ c.href }}">
          <a href="{{ c.href }}">{{ c.label }}</a>
        </sc-if>
        <sc-if value="{{ c.isLast }}">
          {{ c.label }}
        </sc-if>
      </li>
    </sc-for>
  </ul>
</nav>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:48},&quot;path&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{label,href}&gt;&quot;},&quot;homeHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;index.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  /* Drobečková navigace. Cestu dodává stránka; poslední úroveň je bez odkazu. */
  renderVals() {
    const p = this.props;
    /* Oddělovač je v BS Shopu samostatné li — sc-for umí jeden prvek na položku,
       takže se oddělovače vkládají do seznamu jako plnohodnotné položky. */
    const src = p.path ?? [];
    const crumbs = [];
    src.forEach((it, i) => {
      crumbs.push({ isSeparator: true, modifier: 'separator', ariaHidden: 'true', label: '', href: '' });
      const last = i === src.length - 1;
      crumbs.push({
        label: it.label,
        href: last ? '' : (it.href || ''),
        isLast: last,
        modifier: last ? 'last' : '',
      });
    });
    return { crumbs, homeHref: p.homeHref ?? 'index.dc.html' };
  }

/* Cesty k assetům se píšou tak, jak je potřebuje stránka (ds/…), protože relativní
     URL se při importu řeší proti dokumentu stránky, ne proti komponentě. Samostatně
     otevřená komponenta si je po mountu přepíše na svou hloubku. */
  get standalone() { return location.pathname.includes('/komponenty/'); }
  dsPrefix() { return this.standalone ? '../../' : ''; }
  fixStandalonePaths() {
    if (!this.standalone) return;
    document.querySelectorAll('img[src^="ds/"]').forEach(img => { img.src = '../../' + img.getAttribute('src'); });
    document.querySelectorAll('[style*="url(ds/"]').forEach(el => {
      el.setAttribute('style', el.getAttribute('style').split('url(ds/').join('url(../../ds/'));
    });
  }
  ensureDsAssets() {
    if (!document.querySelector('link[href$="ds/styles.css"]')) {
      const l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = this.dsPrefix() + 'ds/styles.css';
      document.head.appendChild(l);
    }
    if (!document.querySelector('#tpSprite') && !document.querySelector('script[src$="ds/assets/icons/sprite.js"]')) {
      const sc = document.createElement('script');
      sc.src = this.dsPrefix() + 'ds/assets/icons/sprite.js';
      document.head.appendChild(sc);
    }
    this.fixStandalonePaths();
  }

  syncCustomElementClasses() {
    document.querySelectorAll('dc-con, dc-gi').forEach(el => {
      const v = el.getAttribute('classname');
      if (v && !el.getAttribute('class')) el.setAttribute('class', v);
    });
  }
  componentDidMount() {
    this.ensureDsAssets();
    this.syncCustomElementClasses();
  }
  componentDidUpdate() { this.syncCustomElementClasses(); }
}

</script>
</body>
</html>
