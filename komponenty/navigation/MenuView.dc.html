<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { background: var(--bg-color); color: var(--text-color); font: var(--font-weight-regular) var(--font-size-14) / var(--line-height-base) var(--font-family); margin: 0; }
    a { color: var(--link-color); text-decoration: none; }
    a:hover { color: var(--link-color-hover); text-decoration: underline; }
    /* CHYBÍ V DS: lišta kategorií dnes scrolluje vodorovně. Má se chovat jinak:
       názvy se nezalamují ani neořezávají, na řádku zůstane jen to, co se celé
       vejde, a zbytek se přesune do „Všechny kategorie“ na pravém konci řádku.
       Kolik položek se vejde, měří logika komponenty. */
    .MenuView > dc-con.dcContent { overflow: visible; position: relative; }
    .MenuView .items { flex: 1 1 auto; min-width: 0; flex-wrap: nowrap; overflow: hidden; }
    .MenuView .items > .root { flex: none; }
    .MenuView .items > .root > a { white-space: nowrap; }
    .MenuView > dc-con.dcContent > .separator, .MenuView > dc-con.dcContent > .button.toggle { flex: none; }
    .MenuView > dc-con.dcContent > .button.toggle { margin-left: auto; }
    /* CHYBÍ V DS: lišta kategorií zůstává na dosah i uprostřed dlouhé stránky.
       Odsazuje se o výšku hlavičky, kterou měří stránka do --tp-header-h. */
    /* Obchází runtime, ne DS: obal importované komponenty má výšku lišty, takže by
       přilepená lišta neměla kam odjet — display: contents ho vyřadí z layoutu. */
    .sc-host:has(> ._menuWrap) { display: contents; }
    ._menuWrap { position: sticky; top: var(--tp-header-h, 0px); z-index: calc(var(--z-header) - 1); }
    /* CHYBÍ V DS: mega-menu má v levém sloupci vždy 1. úroveň kategorií a vpravo
       podkategorie té, na které zákazník stojí. DS zná jen pevný promo blok. */
    .MenuCategoriesRwdView .items > .level_0.active > a { background: var(--color-neutral-100); color: var(--color-main-600); }
    .MenuCategoriesRwdView bs-lazy-render > .items > .level_1 { grid-template-columns: minmax(0, 1fr); }
    .MenuCategoriesRwdView bs-lazy-render .caption { display: block; padding: var(--spacer-16) var(--spacer-20) 0; font-size: var(--font-size-12); font-weight: var(--font-weight-bold); text-transform: uppercase; letter-spacing: .04em; color: var(--text-color-muted); }
    .MenuCategoriesRwdView bs-lazy-render > .items { padding: var(--spacer-16) var(--spacer-20) var(--spacer-24); }
    .MenuCategoriesRwdView ._subToggle, .MenuCategoriesRwdView ._subLevels { display: none; }
    /* CHYBÍ V DS: náhledovky podkategorií v mega-menu (jako na webu). DS zná
       jen textový seznam, proto rozvržení „obrázek 65×65 vlevo, texty vpravo“. */
    .MenuCategoriesRwdView bs-lazy-render .level_1 > span { display: grid; grid-template-columns: 65px minmax(0, 1fr); gap: var(--spacer-4) var(--spacer-12); align-items: start; }
    .MenuCategoriesRwdView bs-lazy-render > .items { gap: var(--spacer-16) var(--spacer-24); }
    .MenuCategoriesRwdView bs-lazy-render .level_1 .name { line-height: var(--line-height-tight, 1.25); }
    .MenuCategoriesRwdView bs-lazy-render .level_2 { margin-top: 0; gap: 0; }
    .MenuCategoriesRwdView bs-lazy-render .level_2 > li > a { padding: 0; line-height: 1.5; }
    /* Kategorie bez náhledovky: v seznamu, kde náhledovky jsou, zůstává místo prázdné,
       aby texty držely stejnou osu. Kde nemá náhledovku nikdo, sloupec se ruší. */
    .MenuCategoriesRwdView bs-lazy-render > .items:not(:has(._thumb)) .level_1 > span { grid-template-columns: minmax(0, 1fr); }
    .MenuCategoriesRwdView bs-lazy-render > .items:has(._thumb) .level_1 > span > .name,
    .MenuCategoriesRwdView bs-lazy-render > .items:has(._thumb) .level_1 > span > .level_2 { grid-column: 2; }
    .MenuCategoriesRwdView ._thumb { grid-row: 1 / span 2; display: block; width: 65px; height: 65px; overflow: hidden; }
    .MenuCategoriesRwdView ._thumb img { display: block; width: 100%; height: 100%; object-fit: contain; }
    /* CHYBÍ V DS: kategorie bez podkategorií — místo osamoceného odkazu CTA tlačítko.
       DS nemá variantu tlačítka pro obsah mega-menu. */
    .MenuCategoriesRwdView ._allCta { display: inline-flex; align-items: center; gap: var(--spacer-8);
      margin: var(--spacer-16) var(--spacer-20) var(--spacer-24); padding: var(--spacer-12) var(--spacer-20);
      background: var(--color-main-500); color: var(--color-white); border-radius: var(--radius-8);
      font-size: var(--font-size-14); font-weight: var(--font-weight-bold); text-decoration: none; }
    .MenuCategoriesRwdView ._allCta:hover { background: var(--color-main-600); color: var(--color-white); text-decoration: none; }
    .MenuCategoriesRwdView ._allCta .icon { width: 16px; height: 16px; }
    .MenuCategoriesRwdView ._topCta { margin: var(--spacer-12) var(--spacer-20) 0; }
    /* CHYBÍ V DS: panel s dlouhou kategorií (Kancelářské potřeby) je vyšší než
       okno — oba sloupce proto scrollují samostatně, panel nepřeroste obrazovku. */
    @media (min-width: 820px) {
      ._menuWrap > .MenuCategoriesRwdView { max-height: calc(100vh - var(--tp-header-h, 0px) - var(--spacer-64)); }
      ._menuWrap > .MenuCategoriesRwdView > dc-con.dcContent { max-height: inherit; }
      .MenuCategoriesRwdView > dc-con.dcContent > .items, .MenuCategoriesRwdView bs-lazy-render { max-height: inherit; overflow-y: auto; }
    }
    /* CHYBÍ V DS: mobilní menu = akordeon. Do pásma l se podkategorie rozbalují
       přímo pod kategorií, protože pravý sloupec panelu se na mobil nevejde. */
    @media (max-width: 819px) {
      .MenuCategoriesRwdView bs-lazy-render { display: none; }
      .MenuCategoriesRwdView .items > .level_0 { display: grid; grid-template-columns: minmax(0, 1fr) var(--spacer-48); align-items: center; }
      .MenuCategoriesRwdView .items > .level_0 > a .bs-crv { display: none; }
      .MenuCategoriesRwdView ._subToggle {
        display: inline-flex; align-items: center; justify-content: center;
        width: var(--spacer-48); min-height: var(--spacer-48); padding: 0;
        border: 0; background: transparent; color: var(--text-color-muted); cursor: pointer;
      }
      .MenuCategoriesRwdView ._subToggle .icon { transition: transform .15s ease; }
      .MenuCategoriesRwdView .level_0.open > ._subToggle .icon { transform: rotate(180deg); }
      .MenuCategoriesRwdView .level_0.open > ._subLevels { display: block; }
      .MenuCategoriesRwdView ._subLevels {
        grid-column: 1 / -1; list-style: none; margin: 0 0 var(--spacer-8);
        padding: 0 0 var(--spacer-4) var(--spacer-28);
      }
      /* Svislou linku drží DS na položkách (._subLevels > li), proto ji tady
         komponenta nekreslí znovu — jinak jsou v akordeonu dvě. */
      .MenuCategoriesRwdView ._subLevels > li { display: block; padding: 0 0 0 var(--spacer-12); }
      .MenuCategoriesRwdView ._subLevels > li > a.name { display: block; min-height: 0; padding: var(--spacer-6) 0; font-size: var(--font-size-16); line-height: 1.35; font-weight: var(--font-weight-bold); color: var(--text-color); }
      .MenuCategoriesRwdView ._subLevels .level_2 { list-style: none; margin: 0 0 var(--spacer-6); padding: 0; display: flex; flex-direction: column; gap: 0; }
      .MenuCategoriesRwdView ._subLevels .level_2 > li > a { display: block; min-height: 0; padding: var(--spacer-4) 0; font-size: var(--font-size-16); line-height: 1.35; color: var(--color-neutral-600); }
    }
  </style>
</helmet>

<div class="_menuWrap" onMouseLeave="{{ onLeave }}">
  <nav class="MenuView v1a v1 bs-view dcon dc000" aria-label="Kategorie">
    <dc-con class="dcContent">
      <ul class="items">
        <sc-for list="{{ items }}" as="i" hint-placeholder-count="10">
          <li class="root {{ i.cls }}"><a href="{{ i.href }}" onMouseEnter="{{ i.onEnter }}" onFocus="{{ i.onEnter }}">{{ i.label }}</a></li>
        </sc-for>
      </ul>
      <span class="separator" aria-hidden="true"></span>
      <button type="button" class="button toggle" onClick="{{ onToggleAll }}" onMouseEnter="{{ onEnterAll }}" aria-expanded="{{ megaOpen }}">
        <svg class="icon ico2" aria-hidden="true"><use href="#tp-menu-2"></use></svg>Všechny kategorie
      </button>
    </dc-con>
  </nav>
  <div class="MenuCategoriesRwdView v1a v1 bs-view dcon dc000" style="display: {{ megaDisplay }}">
    <dc-con class="dcContent">
      <ul class="items">
        <sc-for list="{{ megaItems }}" as="g" hint-placeholder-count="15">
          <li class="level_0 {{ g.cls }}">
            <a href="{{ g.href }}" onMouseEnter="{{ g.onEnter }}" onFocus="{{ g.onEnter }}"><svg class="icon ico2" aria-hidden="true"><use href="{{ g.icon }}"></use></svg>{{ g.label }}<svg class="icon ico2 bs-crv" aria-hidden="true"><use href="#tp-chevron-right"></use></svg></a>
            <sc-if value="{{ g.hasSubs }}" hint-placeholder-val="{{ true }}">
              <button type="button" class="_subToggle" onClick="{{ g.onToggleSub }}" aria-expanded="{{ g.open }}" aria-label="Zobrazit podkategorie"><svg class="icon ico2" aria-hidden="true"><use href="#tp-chevron-down"></use></svg></button>
              <ul class="_subLevels level_1">
                <sc-for list="{{ g.subs }}" as="s" hint-placeholder-count="4">
                  <li>
                    <a class="name" href="{{ s.href }}">{{ s.label }}</a>
                    <ul class="level_2">
                      <sc-for list="{{ s.items }}" as="l" hint-placeholder-count="3">
                        <li><a href="{{ l.href }}">{{ l.label }}</a></li>
                      </sc-for>
                    </ul>
                  </li>
                </sc-for>
              </ul>
            </sc-if>
          </li>
        </sc-for>
      </ul>
      <bs-lazy-render class="expanded">
        <span class="caption">{{ activeCaption }}</span>
        <sc-if value="{{ activeHasCta }}" hint-placeholder-val="{{ false }}">
          <a class="_allCta _topCta" href="{{ activeHref }}">{{ activeCtaLabel }}<svg class="icon ico2" aria-hidden="true"><use href="#tp-chevron-right"></use></svg></a>
        </sc-if>
        <ul class="items">
          <sc-for list="{{ activeSubs }}" as="f" hint-placeholder-count="6">
            <li class="level_1">
              <span>
                <sc-if value="{{ f.thumb }}" hint-placeholder-val="{{ false }}">
                  <a class="_thumb" href="{{ f.href }}" tabindex="-1" aria-hidden="true"><img data-src="{{ f.thumb }}" alt="" width="65" height="65"></a>
                </sc-if>
                <a class="name" href="{{ f.href }}">{{ f.label }}</a>
                <ul class="level_2">
                  <sc-for list="{{ f.items }}" as="l" hint-placeholder-count="3">
                    <li><a href="{{ l.href }}">{{ l.label }}</a></li>
                  </sc-for>
                </ul>
              </span>
            </li>
          </sc-for>
        </ul>
        <sc-if value="{{ activeNoSubs }}" hint-placeholder-val="{{ false }}">
          <a class="_allCta" href="{{ activeHref }}">Zobrazit celou kategorii<svg class="icon ico2" aria-hidden="true"><use href="#tp-chevron-right"></use></svg></a>
        </sc-if>
      </bs-lazy-render>
    </dc-con>
  </div>
</div>

</x-dc>

  open(i) { this.setState({ hover: i }); }

  renderVals() {
    const cats = this.categories;
    const st = this.state;
    const megaOpen = !!this.props.megaOpen || st.allOpen || st.hover !== null;
    const active = cats[st.hover === null ? 0 : st.hover] || cats[0];
    const activeSubs = active.subs;
    const activeNoSubs = !active.subs.length;
    return {
      items: cats.map((g, i) => ({
        label: g.label, href: g.href, cls: g.modifier || '',
        onEnter: () => this.open(i),
      })),
      megaItems: cats.map((g, i) => ({
        label: g.label, href: g.href, icon: g.icon,
        cls: [g.modifier || '', st.hover === i ? 'active' : '', st.openSub === i ? 'open' : ''].filter(Boolean).join(' '),
        hasSubs: g.subs.length > 0, subs: g.subs, open: st.openSub === i,
        onEnter: () => this.open(i),
        onToggleSub: e => { e.preventDefault(); this.setState(s => ({ openSub: s.openSub === i ? null : i })); },
      })),
      megaOpen,
      megaDisplay: megaOpen ? 'block' : 'none',
      activeCaption: active.label,
      activeSubs,
      activeNoSubs,
      activeHref: active.href,
      activeCtaLabel: active.ctaLabel || '',
      activeHasCta: !!active.ctaLabel,
      onToggleAll: () => this.setState(s => ({ allOpen: !(s.allOpen || s.hover !== null), hover: null })),
      onEnterAll: () => this.setState({ hover: null, allOpen: true }),
      onLeave: () => { if (!this.props.megaOpen) this.setState({ hover: null, allOpen: false }); },
    };
  }

  /* Přetečení lišty: položka se nikdy neořezává. Sečteme šířky zleva a jakmile
     se další celá nevejde, schováme ji i všechny za ní — jsou v „Všechny
     kategorie“. Měří se po resize, po doměření fontů a po každém renderu. */
  fitMenu() {
    const list = document.querySelector('.MenuView .items');
    if (!list) return;
    const lis = Array.prototype.slice.call(list.children);
    lis.forEach(li => { li.style.display = ''; });
    if (getComputedStyle(list).display === 'none') return;
    const gap = parseFloat(getComputedStyle(list).columnGap) || 0;
    const avail = list.clientWidth;
    let used = 0, cut = false;
    lis.forEach(li => {
      const w = li.getBoundingClientRect().width;
      const next = used ? used + gap + w : w;
      if (cut || next > avail + 0.5) { cut = true; li.style.display = 'none'; return; }
      used = next;
    });
  }

  syncCustomElementClasses() {
    document.querySelectorAll('dc-con, dc-gi, bs-lazy-render').forEach(el => {
      const v = el.getAttribute('classname');
      if (v && !el.getAttribute('class')) el.setAttribute('class', v);
    });
  }

  /* Styly a sprite DS: při importu do stránky je načítá stránka (relativní cesty
     se pak řeší proti ní, ne proti komponentě). Samostatně otevřená komponenta si
     je doplní sama — proto se nelinkují v helmetu, ale až po mountu a jen když chybí. */
  get standalone() { return location.pathname.includes('/komponenty/'); }
  dsPrefix() { return this.standalone ? '../../' : ''; }
  ensureDsAssets() {
    if (!document.querySelector('link[href$="ds/styles.css"]')) {
      const l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = this.dsPrefix() + 'ds/styles.css';
      document.head.appendChild(l);
    }
    if (!document.querySelector('#tpSprite') && !document.querySelector('script[src$="ds/assets/icons/sprite.js"]')) {
      const sc = document.createElement('script');
      sc.src = this.dsPrefix() + 'ds/assets/icons/sprite.js';
      document.head.appendChild(sc);
    }
  }

  /* Náhledovky se píšou jako data-src; skutečné src se doplní po mountu podle
     hloubky dokumentu (šablonová hole v src by se během streamu vyžádala jako URL). */
  hydrateImages() {
    document.querySelectorAll('.MenuCategoriesRwdView img[data-src]').forEach(img => {
      const src = this.dsPrefix() + img.getAttribute('data-src');
      if (img.getAttribute('src') !== src) img.setAttribute('src', src);
    });
  }

  componentDidMount() {
    this.ensureDsAssets();
    this.hydrateImages();
    this.syncCustomElementClasses();
    /* Mobilní menu otevřené z hamburgeru se při zvětšení okna nad pásmo l zavře —
       jinak by v desktopu zůstal viset panel, který už nemá čím zavřít. */
    this.closeIfDesktop = () => {
      if (window.innerWidth < 820) return;
      if (this.props.megaOpen && this.props.onToggleMega) this.props.onToggleMega();
      if (this.state.allOpen || this.state.hover !== null || this.state.openSub !== null) {
        this.setState({ allOpen: false, hover: null, openSub: null });
      }
    };
    this.onResize = () => { this.fitMenu(); this.closeIfDesktop(); };
    this.fitMenu();
    window.addEventListener('resize', this.onResize);
    window.addEventListener('load', this.onResize);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(this.onResize);
    this.onKey = e => { if (e.key === 'Escape') this.setState({ hover: null, allOpen: false }); };
    document.addEventListener('keydown', this.onKey);
  }
  componentDidUpdate() {
    this.syncCustomElementClasses();
    this.hydrateImages();
    this.fitMenu();
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('load', this.onResize);
    document.removeEventListener('keydown', this.onKey);
  }
}
