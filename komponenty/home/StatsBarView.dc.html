<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { background: var(--bg-color); color: var(--text-color); font: var(--font-weight-regular) var(--font-size-14) / var(--line-height-base) var(--font-family); margin: 0; }
    a { color: var(--link-color); text-decoration: none; }
    a:hover { color: var(--link-color-hover); text-decoration: underline; }
    .sc-host:has(> .StatsBarView) { display: contents; }
  </style>
</helmet>

<section class="StatsBarView v1a v1 bs-view dcon dc000 columns6">
  <dc-con class="dcContent">
    <div class="items"><svg class="icon ico3"><use href="#tp-flag"></use></svg><span><span class="value">30+</span><span class="label">let na trhu</span></span></div>
    <div class="items"><svg class="icon ico3"><use href="#tp-package"></use></svg><span><span class="value">23 000+</span><span class="label">produktů skladem</span></span></div>
    <div class="items"><svg class="icon ico3"><use href="#tp-users"></use></svg><span><span class="value">300 000+</span><span class="label">spokojených zákazníků</span></span></div>
    <div class="items"><svg class="icon ico3"><use href="#tp-truck"></use></svg><span><span class="value">24 h</span><span class="label">obvyklá doba odeslání</span></span></div>
    <div class="items noValue"><svg class="icon ico3"><use href="#tp-building-store"></use></svg><span><span class="label">Dodáváme školám, firmám i úřadům</span></span></div>
    <div class="items noValue"><svg class="icon ico3"><use href="#tp-phone"></use></svg><span><span class="label">Odborné poradenství</span></span></div>
  </dc-con>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  /* Obsah bloku drží komponenta — úpravy textů se dějí tady, ne na stránce. */
/* Cesty k assetům se píšou tak, jak je potřebuje stránka (ds/…), protože relativní
     URL se při importu řeší proti dokumentu stránky, ne proti komponentě. Samostatně
     otevřená komponenta si je po mountu přepíše na svou hloubku. */
  get standalone() { return location.pathname.includes('/komponenty/'); }
  dsPrefix() { return this.standalone ? '../../' : ''; }
  fixStandalonePaths() {
    if (!this.standalone) return;
    document.querySelectorAll('img[src^="ds/"]').forEach(img => { img.src = '../../' + img.getAttribute('src'); });
    document.querySelectorAll('[style*="url(ds/"]').forEach(el => {
      el.setAttribute('style', el.getAttribute('style').split('url(ds/').join('url(../../ds/'));
    });
  }
  ensureDsAssets() {
    if (!document.querySelector('link[href$="ds/styles.css"]')) {
      const l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = this.dsPrefix() + 'ds/styles.css';
      document.head.appendChild(l);
    }
    if (!document.querySelector('#tpSprite') && !document.querySelector('script[src$="ds/assets/icons/sprite.js"]')) {
      const sc = document.createElement('script');
      sc.src = this.dsPrefix() + 'ds/assets/icons/sprite.js';
      document.head.appendChild(sc);
    }
    this.fixStandalonePaths();
  }
  syncCustomElementClasses() {
    document.querySelectorAll('dc-con, dc-gi').forEach(el => {
      const v = el.getAttribute('classname');
      if (v && !el.getAttribute('class')) el.setAttribute('class', v);
    });
  }
  componentDidMount() {
    this.ensureDsAssets();
    this.syncCustomElementClasses();
  }
  componentDidUpdate() { this.syncCustomElementClasses(); }
}
</script>
</body>
</html>
