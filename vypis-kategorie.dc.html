<helmet>
  <link rel="stylesheet" href="ds/styles.css">
  <script src="ds/assets/icons/sprite.js"></script>
  <style>
    /* Náplasti hlavičky nese komponenta komponenty/global/HeaderView.dc.html. */
    body { background: var(--bg-color); color: var(--text-color); font: var(--font-weight-regular) var(--font-size-14) / var(--line-height-base) var(--font-family); margin: 0; }
    a { color: var(--link-color); text-decoration: none; }
    a:hover { color: var(--link-color-hover); text-decoration: underline; }
    /* Obchází runtime, ne DS: host má height: 100 %, takže obsah přetéká mimo svůj
       containing block a sticky hlavička se po ~456 px odlepí. */
    html, body { height: auto; min-height: 100%; }
    #dc-root, #dc-root > .sc-host { height: auto; min-height: 100%; }
    /* CHYBÍ V DS: přilepená má zůstat hlavička i lišta kategorií — menu musí být
       na dosah i uprostřed dlouhého výpisu. Výšku hlavičky měří logika
       do --tp-header-h (na mobilu má hlavička dva řádky). */
    ._menuWrap { position: sticky; top: var(--tp-header-h, 0px); z-index: calc(var(--z-header) - 1); }
    /* CategoryView, ._eshopWidth, rytmus dcQuery, ._categoryText, ._expandButton,
       řádková v5a, jednotka v číselníku, zlom CTA na kartě 820–999 px, popis 13 px
       i v mřížce a ořez lišty kategorií — to všechno už řeší DS (update 2026-08-25). */
    .CategoryView { padding-top: var(--eshop-gap); }
    /* CHYBÍ V DS: .ProductsMasterView má jen max-width, a jako flex položka v
       .CategoryView se scvrkne na obsah — na širokém okně pak výpis nedrží 1560 px
       jako hlavička. V DS chce width: 100 % (nebo align-self: stretch). */
    .CategoryView > .ProductsMasterView { width: 100%; }
    /* CHYBÍ V DS: podtitul nad textem kategorie (na webu je to h2 pod H1). DS zná
       jen .title a .shortDescription, pro ._categoryTextBlock .caption pravidlo nemá. */
    ._categoryTextBlock .caption { font-size: var(--font-size-16); font-weight: var(--font-weight-bold); color: var(--text-color); }
    /* Výchozí karta (číselník + ikonové CTA), čtvercová tlačítka číselníku i skrytý
       label CTA už řeší DS (update 2026-08-25) — zůstává jen písmo jednotky. */
    .ProductView .AddToCartView .quantity .unitsDescription {
      font: var(--font-weight-bold) var(--font-size-14) var(--font-family);
      color: var(--text-color);
    }
    /* CHYBÍ V DS: číselník nemá obal pro dvojici číslo + jednotka, takže „1 bal“ nejde
       vycentrovat — odsazení paddingem vždy posune pár mimo osu. Na stránce je obal
       span.value: jedna položka, která dobírá zbytek řádku a obsah centruje; šířka
       číselného pole jde podle počtu číslic (inline style), jinak zbyde prázdné místo.
       V DS chce .quantity > .value { flex: 1; justify-content: center }. */
    .AddToCartView .quantity > .value,
    .ProductView > dc-con.dcContent .AddToCartView .quantity > .value {
      flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center;
      gap: var(--spacer-2); min-width: 0;
    }
    .AddToCartView .quantity > .value .real,
    .ProductView > dc-con.dcContent .AddToCartView .quantity > .value .real { flex: none; min-width: 0; text-align: right; padding: 0; }
    .AddToCartView .quantity > .value .unitsDescription,
    .ProductView > dc-con.dcContent .AddToCartView .quantity > .value .unitsDescription { flex: none; padding: 0; }
    /* CHYBÍ V DS: drawer filtrů je široký min(--eshop-left-width, 88vw) = 300 px a patička
       s tlačítky „Zrušit filtry“ + „Zobrazit 212 produktů“ se do něj nevejde — tlačítka
       přetékají. V DS chce buď širší panel (~360 px), nebo patičku, která umí zlomit. */
    @media (min-width: 550px) { .FilterView > dc-con.wrap { width: min(360px, 92vw); } }
    .FilterView > dc-con.wrap > dc-con.bottom { flex-wrap: wrap; }
    /* CHYBÍ V DS: původní cena před slevou na kartě výpisu. Přeškrtnutí má v DS jen
       detail (.ProductDetailTableView .value.ghost v css/detail.css), karta pro
       .priceParts .value.ghost pravidlo nemá — vypadá jako obyčejné druhé číslo.
       Podle rozhodnutí je přeškrtnutá a červená (role primary = slevy). */
    .ProductView .priceParts .value.ghost { text-decoration: line-through; color: var(--color-primary-600); font-size: var(--font-size-13); }
    /* CHYBÍ V DS (rozhodnuto): vlajky mají větnou velikost písmen a menší text —
       tokeny --flag-text-transform: uppercase a --flag-font-size: 12 dělají z krátkých
       textů („Akce −18 %“) hlasitý blok. Do DS patří none + 12 px a lehčí řez.
       Pod 12 px se nejde — 11 px je podle tokens/typography.css jen pro chrome
       styleguidu, v produktovém UI je minimum 12 px (a11y). */
    :root { --flag-text-transform: none; --flag-font-size: var(--font-size-12); --flag-font-weight: var(--font-weight-semibold); }
    /* CHYBA V DS: vlajky se násobí s fotkou karty — .mainImage má mix-blend-mode: multiply
       a .ActionIconsView je v DOM před obrázkem. V DS chce z-index + isolation. */
    .ProductView .image .ActionIconsView { z-index: 1; isolation: isolate; }
    /* CHYBÍ V DS: pás aktivních filtrů. DS umí u ._filterButton jen číselnou pilulku
       (kolik filtrů je zapnutých) — zákazník ale nevidí, co je zapnuté, dokud neotevře
       drawer. Do DS patří blok ._activeFilters: popisek „Aktivní filtry“, chips
       s hodnotou a křížkem (odebrání jedné hodnoty) a červený chip pro reset všech.
       Tvar chipu se opírá o --radius-pill a paletu main/primary jako .sortingBox label. */
    ._activeFilters { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacer-8); }
    ._activeFilters .caption { font-size: var(--font-size-13); font-weight: var(--font-weight-semibold); color: var(--text-color-muted); }
    ._activeFilters .chip {
      display: inline-flex; align-items: center; gap: var(--spacer-6);
      min-height: var(--spacer-32); padding: var(--spacer-4) var(--spacer-10);
      border: 0; border-radius: var(--radius-pill); cursor: pointer;
      background: var(--color-main-100); color: var(--color-main-700);
      font: var(--font-weight-semibold) var(--font-size-13) var(--font-family);
    }
    ._activeFilters .chip:hover { background: var(--color-main-200); }
    ._activeFilters .chip:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    ._activeFilters .chip.reset { background: var(--color-primary-100); color: var(--color-primary-700); }
    ._activeFilters .chip.reset:hover { background: var(--color-primary-200); }
  </style>
</helmet>

    </dc-con>

                hint-size="100%,180px"></dc-import>

                hint-size="100%,470px"></dc-import>
            </sc-if>

  last-cls="{{ lastCls }}"

  page-next="{{ pageNext }}"

    { key: 'rez-a4', code: 'REZ-A4', name: 'Páková řezačka Argo A4, 12 listů', desc: 'Kovová základna s měřítkem a přítlačnou lištou. Řez do 12 listů 80g papíru.', priceVat: 1190, priceNoVat: 983, image: 'ds/assets/produkty/rezacka-argo-a4.jpg', avail: 'Skladem 22 ks', availClass: 'cs_zelena', unit: 'ks', sold: 180, added: 3, brand: 'argo' },
    { key: 'rez-a3', code: 'REZ-A3', name: 'Páková řezačka Argo A3, 12 listů', desc: 'Stejná mechanika jako A4, delší lišta pro plakáty a výkresy.', priceVat: 1690, priceNoVat: 1397, image: 'ds/assets/produkty/rezacka-argo-a4.jpg', avail: 'Momentálně vyprodáno', availClass: 'cs_cervena', unit: 'ks', empty: true, sold: 120, added: 7, brand: 'argo' },
    { key: 'lf-a5-80', code: 'LF-A5-80', name: 'Laminovací fólie A5, 80 mic, lesklé, 100 ks', desc: 'Na jmenovky, štítky a menší cedule. Vhodné i do menších laminátorů.', priceVat: 79, priceNoVat: 65.3, image: 'ds/assets/produkty/laminovaci-folie-a4.jpg', avail: 'Skladem 96 bal', availClass: 'cs_zelena', unit: 'bal', sold: 540, added: 8, brand: 'tonerprint' },
    { key: 'paska-4280', code: 'TESA-4280', name: 'Lepicí páska tesa 4280, 25 mm × 66 m, 6 ks', desc: 'Tichá páska do odvíječe. Drží i na recyklovaných kartonech.', priceVat: 189, priceNoVat: 156, image: 'ds/assets/produkty/paska-tesa-4280.jpg', avail: 'Skladem 410 bal', availClass: 'cs_zelena', unit: 'bal', sold: 620, added: 1, brand: 'tesa' },
  ];

  subcategories = [
    { name: 'Skartovačky', count: '48', image: 'ds/assets/produkty/skartovacka-at-13c.jpg' },
    { name: 'Laminace', count: '112', image: 'ds/assets/produkty/laminovaci-folie-a4.jpg' },
    { name: 'Řezačky', count: '36', image: 'ds/assets/produkty/rezacka-argo-a4.jpg' },
    { name: 'Vazba', count: '54', image: 'ds/assets/kategorie/kancelar.png' },
    { name: 'Štítkovače', count: '27', image: 'ds/assets/kategorie/tisk.png' },
    { name: 'Váhy, poštovní', count: '19', image: 'ds/assets/kategorie/sklad.png' },
  ];

  groups = [
    { key: 'vyrobce', name: 'Výrobce', options: [
      { key: 'hp', name: 'HP', count: '84' },
      { key: 'argo', name: 'Argo', count: '61' },
      { key: 'tesa', name: 'tesa', count: '38' },
      { key: 'peach', name: 'Peach', count: '24' },
    ] },
    { key: 'dostupnost', name: 'Dostupnost', options: [
      { key: 'skladem', name: 'Skladem', count: '186' },
      { key: 'do4dnu', name: 'Do 4 dnů', count: '42' },
      { key: 'nadotaz', name: 'Na dotaz', count: '0', disabled: true },
    ] },
    { key: 'typ', name: 'Typ zařízení', options: [
      { key: 'domaci', name: 'Pro domácnost', count: '58' },
      { key: 'kancelar', name: 'Pro kancelář', count: '134' },
      { key: 'provoz', name: 'Pro velký provoz', count: '31' },
    ] },
  ];

  startUsp() {
    clearInterval(this.uspTimer);
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    this.uspTimer = setInterval(() => this.setState(s => ({ usp: (s.usp + 1) % 4 })), 5000);
  }
  uspStep(d) { this.setState(s => ({ usp: (s.usp + d + 4) % 4 })); this.startUsp(); }

  norm(v) { return v.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
  found() {
    const n = this.norm(this.state.q.trim());
    if (!n) return [];
    return this.catalog.filter(p => this.norm(p.name).includes(n) || this.norm(p.code).includes(n));
  }

  /* Ceny v celých korunách (Price.prompt.md) — mezera jako oddělovač tisíců. */
  price(n) { return Math.round(n).toLocaleString('cs-CZ').replace(/\u00a0/g, ' ') + ' Kč'; }

  setQty(key, n) {
    const v = Math.min(999, Math.max(1, n || 1));
    this.setState(s => ({ qtys: { ...s.qtys, [key]: v } }));
  }
  qtyOf(key) { return this.state.qtys[key] ?? 1; }

  addToCart(key) {
    const p = this.catalog.find(x => x.key === key);
    if (!p || p.empty) return;
    const add = this.qtyOf(key);
    this.setState(s => {
      const cart = s.cart.slice();
      const at = cart.findIndex(i => i.key === key);
      if (at >= 0) cart[at] = { ...cart[at], qty: cart[at].qty + add };
      else cart.push({ key, qty: add });
      return { cart };
    });
  }

  itemsLabel(n) { return n === 1 ? '1 produkt' : n < 5 ? n + ' produkty' : n + ' produktů'; }

  /* Výpis má víc než jednu dávku: „Načíst další“ přisype další porci ze zásoby.
     Prototyp — zásoba se skládá z katalogu ve třech vlnách s vlastními kódy. */
  pool() {
    if (this._pool) return this._pool;
    const waves = [0, 1, 2];
    this._pool = waves.flatMap(w => this.catalog.map(p => w === 0 ? p : {
      ...p,
      key: p.key + '-' + w,
      code: p.code + '/' + (w + 1),
      sold: Math.round(p.sold * (1 - w * 0.2)),
      added: p.added + w * 8,
    }));
    return this._pool;
  }

  sorted() {
    const list = this.pool().slice();
    const s = this.state.sort;
    if (s === 'asc') list.sort((a, b) => a.priceVat - b.priceVat);
    else if (s === 'desc') list.sort((a, b) => b.priceVat - a.priceVat);
    else if (s === 'new') list.sort((a, b) => a.added - b.added);
    else list.sort((a, b) => b.sold - a.sold);
    return list;
  }

  toggleCheck(key) {
    this.setState(s => ({ checked: { ...s.checked, [key]: !s.checked[key] } }));
  }

  renderVals() {
    const cart = this.state.cart.map(i => ({ ...this.catalog.find(p => p.key === i.key), qty: i.qty }));
    const count = cart.reduce((n, i) => n + i.qty, 0);
    const total = cart.reduce((n, i) => n + i.priceVat * i.qty, 0);
    const rows = this.state.view === 'rows';
    const cols = 'columns5';
    const filterCount = Object.values(this.state.checked).filter(Boolean).length;
    const page = this.state.page;
    const shown = Math.min(this.state.shown, this.pool().length);
    return {
      /* Našeptávač: hledá v katalogu podle názvu i kódu, diakritika nerozhoduje. */
      q: this.state.q,
      searchActive: this.state.searchOpen && this.state.q.trim() ? 'active' : '',
      onQuery: e => this.setState({ q: e.target.value, searchOpen: true, loginOpen: false }),
      openSearch: () => this.setState({ searchOpen: true, loginOpen: false }),
      clearQuery: () => this.setState({ q: '', searchOpen: false }),
      whisper: this.found().slice(0, 6).map(p => {
        const q = this.state.q.trim();
        const at = this.norm(p.name).indexOf(this.norm(q));
        return {
          code: p.code, image: p.image,
          pre: at < 0 ? p.name : p.name.slice(0, at),
          hit: at < 0 ? '' : p.name.slice(at, at + q.length),
          post: at < 0 ? '' : p.name.slice(at + q.length),
          priceVat: this.price(p.priceVat),
          availability: p.avail, availClass: p.availClass,
          buy: () => this.addToCart(p.key),
        };
      }),
      asideCategories: [
        { label: 'Kancelářská technika', value: '212', href: 'vypis-kategorie.dc.html' },
        { label: 'Skartovačky', value: '48', href: 'vypis-kategorie.dc.html' },
        { label: 'Laminace', value: '112', href: 'vypis-kategorie.dc.html' },
      ],
      asideManufacturers: [
        { label: 'AT', value: '61', href: 'vypis-kategorie.dc.html' },
        { label: 'Argo', value: '54', href: 'vypis-kategorie.dc.html' },
        { label: 'tesa', value: '38', href: 'vypis-kategorie.dc.html' },
      ],
      whisperCount: this.found().length,
      hasWhisper: this.found().length > 0,
      noWhisper: this.state.searchOpen && !!this.state.q.trim() && this.found().length === 0,
      loginOpen: this.state.loginOpen,
      loginActive: this.state.loginOpen ? 'active' : '',
      /* Přihlášení: spouští ho ikona v hlavičce, „Rychlý nákup“ i odkaz v horním pruhu.
         Panel žije v .LoginUserView jako ._headerPopup. */
      toggleLogin: e => { e.preventDefault(); this.setState(s => ({ loginOpen: !s.loginOpen })); },
      closePopups: () => this.setState({ loginOpen: false }),
      uspPrev: () => this.uspStep(-1),
      uspNext: () => this.uspStep(1),
      breadcrumb: [{"label":"Kancelářská technika","href":""}],
      topbarUsp: this.topbar.usp,
      topbarLinks: this.topbar.links,
      uspCurrent: this.state.usp,
      menuItems: this.menu.items,
      megaItems: this.menu.mega,
      megaFeatured: this.menu.featured,
      megaOpen: this.state.mega,
      megaDisplay: this.state.mega ? 'block' : 'none',
      toggleMega: () => this.setState(s => ({ mega: !s.mega })),

      cartCount: count,
      cartTotal: this.price(total),
      cartItemsLabel: this.itemsLabel(count),
      basketEmptyClass: count ? '' : 'empty',

      /* rozbalovací text kategorie */
      textCollapsed: this.state.textOpen ? '' : 'collapsed',
      textExpanded: this.state.textOpen ? 'true' : 'false',
      textToggleLabel: this.state.textOpen ? 'Zobrazit méně' : 'Zobrazit více',
      toggleText: () => this.setState(s => ({ textOpen: !s.textOpen })),

      showSubcategories: this.props.showSubcategories ?? true,
      subcategories: this.subcategories,

      /* řazení */
      sort: this.state.sort,
      sortTop: this.state.sort === 'top',
      sortAsc: this.state.sort === 'asc',
      sortDesc: this.state.sort === 'desc',
      sortNew: this.state.sort === 'new',
      setSortTop: () => this.setState({ sort: 'top' }),
      setSortAsc: () => this.setState({ sort: 'asc' }),
      setSortDesc: () => this.setState({ sort: 'desc' }),
      setSortNew: () => this.setState({ sort: 'new' }),
      onSortSelect: e => this.setState({ sort: e.target.value }),

      /* přepínač zobrazení */
      gridClass: rows ? 'inactive' : 'active',
      rowsClass: rows ? 'active' : 'inactive',
      setGrid: e => { e.preventDefault(); this.setState({ view: 'grid' }); },
      setRows: e => { e.preventDefault(); this.setState({ view: 'rows' }); },
      isRows: rows,
      isGrid: !rows,
      listClass: rows ? 'custom1' : cols,
      cardMod: rows ? 'big' : '',

      totalItems: '212',
      shownLabel: 'Zobrazeno ' + shown + ' z 212 produktů',
      hasMore: shown < this.pool().length,
      loadMoreLabel: 'Načíst dalších ' + Math.min(8, this.pool().length - shown) + ' produktů',
      loadMore: () => this.setState(s => ({ shown: s.shown + 8 })),

      products: this.sorted().slice(0, shown).map(p => ({
        ...p,
        stateClass: p.empty ? 'empty' : 'canBuy',
        priceVat: this.price(p.priceVat),
        priceNoVat: this.price(p.priceNoVat),
        oldPrice: p.old ? this.price(p.old) : '',
        hasOld: !!p.old,
        hasFlag: !!p.flag,
        flag: p.flag || '',
        flagClass: p.flagClass || '',
        availability: p.avail,
        availClass: p.availClass,
        qty: this.qtyOf(p.key),
        /* Šířka pole podle počtu číslic — jinak zbyde v poli prázdné místo a dvojice
           „1 bal“ se opticky odsune od osy číselníku. */
        qtyWidth: String(this.qtyOf(p.key)).length + 'ch',
        inc: () => this.setQty(p.key, this.qtyOf(p.key) + 1),
        dec: () => this.setQty(p.key, this.qtyOf(p.key) - 1),
        setQty: e => this.setQty(p.key, parseInt(e.target.value, 10)),
        buy: () => this.addToCart(p.key),
      })),

      /* stránkování pod výpisem */
      pages: [1, 2, 3, 4, 5].map(n => ({
        label: String(n),
        cls: n === page ? 'selected' : '',
        go: () => this.setState({ page: n }),
      })),
      lastCls: page === 24 ? 'selected' : '',
      goLast: () => this.setState({ page: 24 }),
      prevDisabled: page === 1,
      pagePrev: () => this.setState(s => ({ page: Math.max(1, s.page - 1) })),
      pageNext: () => this.setState(s => ({ page: Math.min(24, s.page + 1) })),

      /* drawer filtrů */
      filterActive: this.state.filterOpen ? 'active' : '',
      openFilter: () => this.setState({ filterOpen: true }),
      closeFilter: () => this.setState({ filterOpen: false }),
      filterCount: filterCount,
      clearFilters: () => this.setState({ checked: {} }),
      /* Aktivní filtry jako chips nad výpisem — vidět je bez otevření drawru. */
      hasActiveFilters: filterCount > 0,
      activeFilters: this.groups.flatMap(g => g.options
        .filter(o => this.state.checked[o.key])
        .map(o => ({ name: g.name + ': ' + o.name, remove: () => this.toggleCheck(o.key) }))),
      filterGroups: this.groups.map(g => ({
        name: g.name,
        cls: this.state.collapsedGroups[g.key] ? 'noAutoExpand' : '',
        expanded: this.state.collapsedGroups[g.key] ? 'false' : 'true',
        toggle: () => this.setState(s => ({ collapsedGroups: { ...s.collapsedGroups, [g.key]: !s.collapsedGroups[g.key] } })),
        options: g.options.map(o => ({
          name: o.name,
          count: o.count,
          cls: o.disabled ? 'disabled' : '',
          disabled: !!o.disabled,
          checked: !!this.state.checked[o.key],
          toggle: () => this.toggleCheck(o.key),
        })),
      })),

      toggleColumn: e => {
        const col = e.currentTarget.parentElement;
        const open = col.classList.toggle('expanded');
        e.currentTarget.setAttribute('aria-expanded', String(open));
      },
    };
  }

  /* React lowercases class na custom elementech (dc-con → classname="…"), takže
     selektory BS Shopu .View > dc-con.dcContent nesedí. Přeneseme to na class. */
  syncCustomElementClasses() {
    document.querySelectorAll('dc-con, dc-gi, dc-root').forEach(el => {
      const v = el.getAttribute('classname');
      if (v && !el.getAttribute('class')) el.setAttribute('class', v);
    });
  }

  /* Přilepení hlavičky a měření --tp-header-h řeší komponenta HeaderView. */

  closeOnOutside = e => {
    const inSearch = e.target.closest && e.target.closest('.SimpleSearchView');
    const inLogin = e.target.closest && e.target.closest('.LoginUserView, ._quickBuy, .UserContentPanelView');
    if (!inSearch && this.state.searchOpen) this.setState({ searchOpen: false });
    if (!inLogin && this.state.loginOpen) this.setState({ loginOpen: false });
  };

  componentDidMount() {
    document.addEventListener('mousedown', this.closeOnOutside);
    this.syncCustomElementClasses();
    this.startUsp();
    this.onKeyDown = e => {
      if (e.key !== 'Escape') return;
      if (this.state.filterOpen || this.state.mega || this.state.searchOpen || this.state.loginOpen) {
        this.setState({ filterOpen: false, mega: false, searchOpen: false, loginOpen: false });
      }
    };
    document.addEventListener('keydown', this.onKeyDown);
  }
  componentDidUpdate() { this.syncCustomElementClasses(); }
  componentWillUnmount() {
    clearInterval(this.uspTimer);
    document.removeEventListener('keydown', this.onKeyDown);
    document.removeEventListener('mousedown', this.closeOnOutside);
  }
}

</script>

</html>
