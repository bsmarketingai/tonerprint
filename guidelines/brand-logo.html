<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--color-white); }
  
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .box { border-radius: var(--radius-8); padding: 20px; display: flex; align-items: center; justify-content: center; }
  .light { background: var(--color-white); border: var(--border); }
  .dark { background: var(--color-main-900); }
</style>
</head>
<body>
<div class="row">
    <div class="box light">
      <svg width="210" height="60" viewBox="0 0 210 60" role="img" aria-label="TonerPrint">
        <circle cx="26" cy="15" r="9" fill="#FDAC00"></circle>
        <circle cx="12" cy="30" r="9" fill="#25BBFB"></circle>
        <circle cx="40" cy="30" r="9" fill="#FD453D"></circle>
        <circle cx="26" cy="45" r="9" fill="#011B3D"></circle>
        <text x="54" y="41" font-family="Figtree, Arial, sans-serif" font-size="33" font-weight="800" letter-spacing="-1.4">
          <tspan fill="#011B3D">Toner</tspan><tspan fill="#0065FC">print</tspan>
        </text>
      </svg>
    </div>
    <div class="box dark">
      <svg width="210" height="60" viewBox="0 0 210 60" role="img" aria-label="TonerPrint">
        <circle cx="26" cy="15" r="9" fill="#FDAC00"></circle>
        <circle cx="12" cy="30" r="9" fill="#25BBFB"></circle>
        <circle cx="40" cy="30" r="9" fill="#FD453D"></circle>
        <circle cx="26" cy="45" r="9" fill="#FFFFFF"></circle>
        <text x="54" y="41" font-family="Figtree, Arial, sans-serif" font-size="33" font-weight="800" letter-spacing="-1.4">
          <tspan fill="#FFFFFF">Toner</tspan><tspan fill="#3385FF">print</tspan>
        </text>
      </svg>
    </div>
  </div>

</body>
</html>
