<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--color-white); }
  
  .row { display: grid; grid-template-columns: 92px 1fr; gap: 16px; align-items: baseline; padding: 7px 0; border-bottom: var(--border); }
  .row:last-child { border-bottom: 0; }
  .tok { font-size: 11px; font-weight: 700; color: var(--text-color-muted); }
  .t { font-weight: 800; line-height: var(--line-height-tight); }
</style>
</head>
<body>
<div class="row"><span class="tok">48 px</span><span class="t" style="font-size:48px">Tonery a technika</span></div>
  <div class="row"><span class="tok">40 px</span><span class="t" style="font-size:40px">Tonery a technika</span></div>
  <div class="row"><span class="tok">32 px</span><span class="t" style="font-size:32px">Tonery a technika</span></div>
  <div class="row"><span class="tok">28 px</span><span class="t" style="font-size:28px">Tonery a technika</span></div>
  <div class="row"><span class="tok">24 px</span><span class="t" style="font-size:24px">Tonery a technika</span></div>

</body>
</html>
