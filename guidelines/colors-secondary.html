<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--color-white); }
  
  .ramp { display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; border-radius: var(--radius-6); overflow: hidden; }
  .sw { height: 96px; display: flex; align-items: flex-end; padding: 8px; }
  .sw b { font-size: 11px; font-weight: 700; opacity: .85; }
</style>
</head>
<body>
<div class="ramp">
    <div class="sw" style="background:var(--color-secondary-100)"><b style="color:var(--color-on-secondary-100)">100</b></div>
    <div class="sw" style="background:var(--color-secondary-200)"><b style="color:var(--color-on-secondary-200)">200</b></div>
    <div class="sw" style="background:var(--color-secondary-300)"><b style="color:var(--color-on-secondary-300)">300</b></div>
    <div class="sw" style="background:var(--color-secondary-400)"><b style="color:var(--color-on-secondary-400)">400</b></div>
    <div class="sw" style="background:var(--color-secondary-500)"><b style="color:var(--color-on-secondary-500)">500</b></div>
    <div class="sw" style="background:var(--color-secondary-600)"><b style="color:var(--color-on-secondary-600)">600</b></div>
    <div class="sw" style="background:var(--color-secondary-700)"><b style="color:var(--color-on-secondary-700)">700</b></div>
    <div class="sw" style="background:var(--color-secondary-800)"><b style="color:var(--color-on-secondary-800)">800</b></div>
    <div class="sw" style="background:var(--color-secondary-900)"><b style="color:var(--color-on-secondary-900)">900</b></div>
  </div>

</body>
</html>
