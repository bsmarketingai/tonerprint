<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--color-white); }
  
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 2px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px;
          border-radius: var(--radius-4); color: var(--color-main-800); }
  .cell span { font-size: 9px; color: var(--text-color-muted); text-align: center; line-height: 1.2; }
</style>
</head>
<body>
<div class="grid">
    <div class="cell"><svg class="icon ico3"><use href="#tp-shopping-cart"></use></svg><span>shopping-cart</span></div>
    <div class="cell"><svg class="icon ico3"><use href="#tp-search"></use></svg><span>search</span></div>
    <div class="cell"><svg class="icon ico3"><use href="#tp-user"></use></svg><span>user</span></div>
    <div class="cell"><svg class="icon ico3"><use href="#tp-heart"></use></svg><span>heart</span></div>

    <div class="cell"><svg class="icon ico3"><use href="#tp-filter"></use></svg><span>filter</span></div>
    <div class="cell"><svg class="icon ico3"><use href="#tp-star"></use></svg><span>star</span></div>
    <div class="cell"><svg class="icon ico3"><use href="#tp-printer"></use></svg><span>printer</span></div>
    <div class="cell"><svg class="icon ico3"><use href="#tp-mail"></use></svg><span>mail</span></div>
    <div class="cell"><svg class="icon ico3"><use href="#tp-bell"></use></svg><span>bell</span></div>
    <div class="cell"><svg class="icon ico3"><use href="#tp-arrows-left-right"></use></svg><span>arrows-left-right</span></div>
    <div class="cell"><svg class="icon ico3"><use href="#tp-message-question"></use></svg><span>message-question</span></div>
    <div class="cell"><svg class="icon ico3"><use href="#tp-circle-check"></use></svg><span>circle-check</span></div>
