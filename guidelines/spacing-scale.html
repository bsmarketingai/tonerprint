<!-- @dsCard group="Spacing" viewport="700x150" name="Spacery" subtitle="Škála pojmenovaná hodnotou v px. Mezi 32 a 64 se neinterpoluje." -->
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--color-white); }
  
  .row { display: flex; align-items: flex-end; gap: 6px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .bar { background: var(--color-main-500); border-radius: 2px; width: 100%; }
  .n { font-size: 10px; color: var(--text-color-muted); font-weight: 700; }
</style>
</head>
<body>
<div class="row">
    <div class="col" style="width:14px"><div class="bar" style="height:4px"></div><span class="n">4</span></div>
    <div class="col" style="width:14px"><div class="bar" style="height:6px"></div><span class="n">6</span></div>
    <div class="col" style="width:14px"><div class="bar" style="height:8px"></div><span class="n">8</span></div>
    <div class="col" style="width:14px"><div class="bar" style="height:10px"></div><span class="n">10</span></div>
    <div class="col" style="width:14px"><div class="bar" style="height:12px"></div><span class="n">12</span></div>
    <div class="col" style="width:14px"><div class="bar" style="height:14px"></div><span class="n">14</span></div>
    <div class="col" style="width:14px"><div class="bar" style="height:16px"></div><span class="n">16</span></div>
    <div class="col" style="width:14px"><div class="bar" style="height:20px"></div><span class="n">20</span></div>
    <div class="col" style="width:14px"><div class="bar" style="height:24px"></div><span class="n">24</span></div>
    <div class="col" style="width:16px"><div class="bar" style="height:32px"></div><span class="n">32</span></div>
    <div class="col" style="width:20px"><div class="bar" style="height:40px"></div><span class="n">40</span></div>
    <div class="col" style="width:24px"><div class="bar" style="height:48px"></div><span class="n">48</span></div>
    <div class="col" style="width:28px"><div class="bar" style="height:56px"></div><span class="n">56</span></div>
    <div class="col" style="width:32px"><div class="bar" style="height:64px"></div><span class="n">64</span></div>
    <div class="col" style="width:40px"><div class="bar" style="height:80px"></div><span class="n">80</span></div>
  </div>

</body>
</html>
