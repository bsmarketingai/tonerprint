<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--color-white); }
  
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
  .row + .row { margin-top: 18px; }
  .row img { display: block; height: 26px; width: auto; }
  .lbl { width: 100%; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-color-muted); }
</style>
</head>
<body>
<div class="row">
    <span class="lbl">Platby</span>
    <img src="../assets/platby/visa-mastercard.svg" alt="Visa a Mastercard">
    <img src="../assets/platby/maestro.svg" alt="Maestro">
    <img src="../assets/platby/applepay.svg" alt="Apple Pay">
    <img src="../assets/platby/googlepay.svg" alt="Google Pay">
    <img src="../assets/platby/comgate.svg" alt="Comgate">
    <img src="../assets/platby/twisto.svg" alt="Twisto">
  </div>
  <div class="row">
    <span class="lbl">Doprava</span>
    <img src="../assets/doprava/ppl.svg" alt="PPL">
    <img src="../assets/doprava/zasilkovna.svg" alt="Zásilkovna">
    <img src="../assets/doprava/dpd.svg" alt="DPD">
    <img src="../assets/doprava/ceska-posta.svg" alt="Česká pošta">
    <img src="../assets/doprava/ceska-posta-balikovna.svg" alt="Balíkovna">
  </div>

</body>
</html>
