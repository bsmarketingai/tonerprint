<!-- @dsCard group="Colors" viewport="700x150" name="Primary — akční červená" subtitle="Jen slevy a destruktivní akce. Nikdy jako druhé CTA." -->
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--color-white); }
  
  .ramp { display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; border-radius: var(--radius-6); overflow: hidden; }
  .sw { height: 96px; display: flex; align-items: flex-end; padding: 8px; }
  .sw b { font-size: 11px; font-weight: 700; opacity: .85; }
</style>
</head>
<body>
<div class="ramp">
    <div class="sw" style="background:var(--color-primary-100)"><b style="color:var(--color-on-primary-100)">100</b></div>
    <div class="sw" style="background:var(--color-primary-200)"><b style="color:var(--color-on-primary-200)">200</b></div>
    <div class="sw" style="background:var(--color-primary-300)"><b style="color:var(--color-on-primary-300)">300</b></div>
    <div class="sw" style="background:var(--color-primary-400)"><b style="color:var(--color-on-primary-400)">400</b></div>
    <div class="sw" style="background:var(--color-primary-500)"><b style="color:var(--color-on-primary-500)">500</b></div>
    <div class="sw" style="background:var(--color-primary-600)"><b style="color:var(--color-on-primary-600)">600</b></div>
    <div class="sw" style="background:var(--color-primary-700)"><b style="color:var(--color-on-primary-700)">700</b></div>
    <div class="sw" style="background:var(--color-primary-800)"><b style="color:var(--color-on-primary-800)">800</b></div>
    <div class="sw" style="background:var(--color-primary-900)"><b style="color:var(--color-on-primary-900)">900</b></div>
  </div>

</body>
</html>
