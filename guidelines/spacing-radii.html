<!-- @dsCard group="Spacing" viewport="700x150" name="Radiusy" subtitle="Sady border-0 až border-5. Karty a panely mají 8 px, popup 16 px." -->
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--color-white); }
  
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .box { width: 88px; height: 72px; background: var(--color-main-100); border: 1px solid var(--color-main-300);
         display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px;
         font-size: 11px; font-weight: 700; color: var(--color-main-800); }
</style>
</head>
<body>
<div class="row">
    <div class="box" style="border-radius:var(--radius-0)">0</div>
    <div class="box" style="border-radius:var(--radius-2)">2 px</div>
    <div class="box" style="border-radius:var(--radius-4)">4 px</div>
    <div class="box" style="border-radius:var(--radius-6)">6 px</div>
    <div class="box" style="border-radius:var(--radius-8)">8 px</div>
    <div class="box" style="border-radius:var(--radius-16)">16 px</div>
    <div class="box" style="border-radius:var(--radius-pill)">pill</div>
  </div>

</body>
</html>
