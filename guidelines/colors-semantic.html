<!-- @dsCard group="Colors" viewport="700x150" name="Sémantické role" subtitle="Pozadí, text a odkazy — tyto tokeny se používají místo přímých odstínů." -->
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--color-white); }
  
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .item { border: var(--border); border-radius: var(--radius-6); overflow: hidden; }
  .item .chip { height: 56px; }
  .item .lbl { padding: 8px 10px; font: 600 11px/1.3 var(--font-family); color: var(--text-color-muted); }
  .item .lbl b { display: block; color: var(--text-color); font-size: 12px; }
</style>
</head>
<body>
<div class="grid">
    <div class="item"><div class="chip" style="background:var(--bg-color)"></div><div class="lbl"><b>--bg-color</b>plocha stránky</div></div>
    <div class="item"><div class="chip" style="background:var(--bg-view-color)"></div><div class="lbl"><b>--bg-view-color</b>karta, panel</div></div>
    <div class="item"><div class="chip" style="background:var(--bg-topbar-color)"></div><div class="lbl"><b>--bg-topbar-color</b>horní pruh</div></div>
    <div class="item"><div class="chip" style="background:var(--text-color)"></div><div class="lbl"><b>--text-color</b>základní text</div></div>
    <div class="item"><div class="chip" style="background:var(--text-color-muted)"></div><div class="lbl"><b>--text-color-muted</b>doplňkový text</div></div>
    <div class="item"><div class="chip" style="background:var(--link-color)"></div><div class="lbl"><b>--link-color</b>odkaz</div></div>
    <div class="item"><div class="chip" style="background:var(--border-color)"></div><div class="lbl"><b>--border-color</b>rámečky</div></div>
    <div class="item"><div class="chip" style="background:var(--review-star-color)"></div><div class="lbl"><b>--review-star-color</b>hvězdy</div></div>
  </div>

</body>
</html>
