<!-- @dsCard group="Colors" viewport="700x150" name="Success — dostupnost" subtitle="500 pro „Skladem", 100 jako podklad panelu doručení." -->
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--color-white); }
  
  .ramp { display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; border-radius: var(--radius-6); overflow: hidden; }
  .sw { height: 96px; display: flex; align-items: flex-end; padding: 8px; }
  .sw b { font-size: 11px; font-weight: 700; opacity: .85; }
</style>
</head>
<body>
<div class="ramp">
    <div class="sw" style="background:var(--color-success-100)"><b style="color:var(--color-on-success-100)">100</b></div>
    <div class="sw" style="background:var(--color-success-200)"><b style="color:var(--color-on-success-200)">200</b></div>
    <div class="sw" style="background:var(--color-success-300)"><b style="color:var(--color-on-success-300)">300</b></div>
    <div class="sw" style="background:var(--color-success-400)"><b style="color:var(--color-on-success-400)">400</b></div>
    <div class="sw" style="background:var(--color-success-500)"><b style="color:var(--color-on-success-500)">500</b></div>
    <div class="sw" style="background:var(--color-success-600)"><b style="color:var(--color-on-success-600)">600</b></div>
    <div class="sw" style="background:var(--color-success-700)"><b style="color:var(--color-on-success-700)">700</b></div>
    <div class="sw" style="background:var(--color-success-800)"><b style="color:var(--color-on-success-800)">800</b></div>
    <div class="sw" style="background:var(--color-success-900)"><b style="color:var(--color-on-success-900)">900</b></div>
  </div>

</body>
</html>
